# vinOS CI — lint, AUR cache, and ISO build+test.
# Trigger: manual dispatch only.
#
# Deliberately NOT on tag push. The ISO that ships is the one built on
# the maintainer's server and verified on real T2 hardware; rebuilding
# it at tag time would attach a *different* artifact than the one that
# passed the hardware checkpoint. release.yml owns tag-time publishing.
#
# The `iso` job runs on a self-hosted runner because mkarchiso needs
# real loop devices + privileged docker, which GitHub-hosted runners
# don't expose. Runner setup (label = "self-hosted-dell") and secrets
# are user-side.
#
# The `lint` job is GH-hosted and validates that scripts pass
# shellcheck and packages.x86_64 is in sync with iso/gen-packages.sh.
name: iso

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install shellcheck + rsync
        run: pacman -Sy --needed --noconfirm shellcheck rsync bash
      - uses: actions/checkout@v4

      - name: Shellcheck every install/lib/bin/iso script
        run: |
          set -e
          mapfile -t scripts < <(find install lib bin iso overlays tests \
            -type f \( -name '*.sh' -o -name 'vinos-*' \))
          # Vinos-* scripts under bin/ have no extension; guarantee we
          # only pass shell files.
          for f in "${scripts[@]}"; do
            head -1 "$f" | grep -q '^#!.*bash\|^#!.*sh' || continue
            printf '=== %s ===\n' "$f"
            shellcheck -x "$f" || exit 1
          done

      - name: gen-packages drift check
        run: |
          set -e
          cp iso/profile/packages.x86_64 /tmp/before
          bash iso/gen-packages.sh >/dev/null
          if ! diff -u /tmp/before iso/profile/packages.x86_64 >/dev/null; then
            echo "::error::iso/profile/packages.x86_64 is out of date — run iso/gen-packages.sh and commit"
            diff -u /tmp/before iso/profile/packages.x86_64 | head -80
            exit 1
          fi

  iso:
    needs: lint
    runs-on: [self-hosted, dell]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build ISO (mkarchiso via docker --privileged)
        run: |
          # Runner already has docker + KVM per the setup docs.
          iso/build.sh

      - name: Test ISO (QEMU matrix — BIOS+UEFI, 3G floor, offline)
        run: iso/test.sh --mode matrix --timeout 360

      # Only the sha256 manifest travels — a 4 GB ISO is well past
      # GitHub's per-artifact limits, and iso/out holds every prior
      # build besides. The ISO itself lives on Tigris (release.yml).
      - name: Upload sha256 manifest (7-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: vinos-iso-${{ steps.version.outputs.value }}-sha256
          path: iso/out/sha256sums.txt
          retention-days: 7

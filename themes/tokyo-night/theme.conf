# vinOS theme: tokyo-night (default)
# Sourced by config helpers when a component reads the active theme.
# Format is plain shell so it works from bash and from Python/Node via
# a tiny parser. Colors are hex without '#'.
name = tokyo-night
description = default vinOS theme — deep navy + cyan accents

background = 1a1b26
foreground = c0caf5
accent     = 33ccff
border     = 33ccff
muted      = 565f89
red        = f7768e
green      = 9ece6a
yellow     = e0af68
blue       = 7aa2f7
magenta    = bb9af7
cyan       = 7dcfff

# Wallpaper filename (relative to /usr/share/vinos/themes/<name>/).
wallpaper  = wallpaper.png

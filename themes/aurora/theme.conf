# vinOS theme: aurora (default)
# Warm dawn — muted violet clouds, peach sunrise, layered blue mountains.
# Bright enough not to read as "screen off" on first boot.
name = aurora
description = default vinOS theme — warm dawn over dusk-blue mountains

background = 2b2942
foreground = f5eddb
accent     = d8a686
border     = c39ecb
muted      = 6d6d92
red        = e88b93
green      = 9dc494
yellow     = ecd39a
blue       = 8ca8d8
magenta    = c39ecb
cyan       = a8c9d8

# Wallpaper is staged into /usr/share/vinos/themes/<name>/wallpaper.png
# by install/05-branding.sh from assets/wallpapers/<name>/wallpaper.png.
wallpaper  = wallpaper.png

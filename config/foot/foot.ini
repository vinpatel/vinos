# vinOS foot terminal — tokyo-night. JetBrainsMono Nerd Font at 11pt,
# no title bar (Hyprland provides the frame), 240-line scrollback.
font=JetBrainsMono Nerd Font:size=11
pad=8x8
initial-window-size-chars=100x30

[cursor]
style=beam
beam-thickness=2
blink=yes

[scrollback]
lines=2400
multiplier=3.0

# foot 1.20+ renamed [colors] → [colors-dark] (matched with [colors-light]
# for auto-switching). vinOS is dark-only, so we only ship [colors-dark].
[colors-dark]
alpha=0.97
foreground=c0caf5
background=1a1b26

# regular
regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6

# bright
bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5

selection-foreground=c0caf5
selection-background=283457

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

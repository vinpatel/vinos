# vinOS Alacritty — matches Waybar's Tokyo-Night-ish palette.

[window]
padding    = { x = 8, y = 8 }
opacity    = 0.95
decorations = "none"

[font]
size = 11
normal.family = "JetBrainsMono Nerd Font"
bold.family   = "JetBrainsMono Nerd Font"
italic.family = "JetBrainsMono Nerd Font"

[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.normal]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

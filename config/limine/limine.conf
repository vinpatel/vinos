### vinOS boot menu — limine
#
# Authored for vinOS. Palette sampled from the nebula theme
# (themes/nebula/theme.conf): deep midnight → galactic mauve → starlight.
#
# This file is the THEME HEADER only. The installer's bootloader phase
# appends the generated /boot entries beneath it, so the look stays in
# one place and entry generation stays in one place.
#
# Reference: /usr/share/doc/limine/CONFIG.md (limine 12.5.2)
# Paths use boot():/ — the partition holding this config file, i.e. the ESP.

timeout: 5
default_entry: 1
remember_last_entry: yes

# ── identity ───────────────────────────────────────────────────────
interface_branding: vinOS
interface_branding_colour: a184c4
interface_help_colour: 6a698a
interface_help_colour_bright: 7dcfff

# ── wallpaper ──────────────────────────────────────────────────────
# 1920x1080 JPEG, ~318 KB. Downscaled from the 4K nebula wallpaper so
# firmware decodes it fast — the 4K PNG is 13 MB and visibly stalls the
# menu. Lives on the ESP alongside this file; the bootloader phase
# copies it there.
wallpaper: boot():/vinos-wallpaper.jpg
wallpaper_style: stretched

# Shown where the image does not cover the screen (and behind it while
# it decodes) — vinOS midnight, so there is never a white flash.
backdrop: 151a26

# ── terminal colours ───────────────────────────────────────────────
# term_background is TTRRGGBB — TT is transparency, which is how the
# wallpaper shows through the menu panel. Tuned in QEMU.
term_background: A0151a26
term_foreground: d4d8e8
term_background_bright: 1f2637
term_foreground_bright: ffffff

# 8 colours: black, red, green, brown, blue, magenta, cyan, gray
term_palette: 151a26;e88b93;9dc494;e0c088;6a698a;a184c4;7dcfff;d4d8e8
# 8 bright: dark gray, br red, br green, yellow, br blue, br magenta, br cyan, white
term_palette_bright: 59536c;f0a3aa;b3d6ab;ecd3a3;8a89ab;bfa6db;a5e0ff;ffffff

# Breathing room so the panel floats over the wallpaper rather than
# sitting flush against the bezel.
term_margin: 96
term_margin_gradient: 0

hash_mismatch_panic: no

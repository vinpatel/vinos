### vinOS live medium — boot entries
#
# Appended beneath config/limine/limine.conf (the theme header) by
# iso/mklimine-iso.sh when it re-masters the archiso output onto limine.
# The installed system's entries are generated separately by
# iso/installer/bootloader/all.sh — this file is the LIVE USB menu only.
#
# Order and kernel command lines mirror
# iso/profile/efiboot/loader/entries/*.conf one-for-one, so switching
# bootloaders changes how the menu looks, not what it boots. Keep the two
# in sync: iso/qa/config-lint.sh compares them.
#
# Three placeholders are substituted at re-master time, spelled the same
# way archiso spells them in its own entry templates: INSTALL_DIR (the
# install_dir from profiledef.sh, "arch"), ARCH ("x86_64"), and
# ARCHISO_UUID (the /boot/<uuid>.uuid stamp mkarchiso wrote), each wrapped
# in percent signs. This comment avoids writing them out literally so the
# substitution does not rewrite the documentation along with the entries.
#
# Titles are ASCII on purpose. Limine draws the menu with its built-in
# console font, which has no glyph for the arrow/gear/dot marks the
# systemd-boot titles used — they came out as tofu boxes in QEMU.
#
# boot():/ is the volume holding this config file — the ISO9660 filesystem,
# which is also where mkarchiso puts the kernels.

/Boot vinOS  —  Apple T2 Mac (2018-2020)
    comment: MacBook Pro / Air / iMac with the T2 security chip. Broadcom Wi-Fi, keyboard and trackpad drivers.
    protocol: linux
    kernel_path: boot():/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2
    module_path: boot():/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-t2.img
    kernel_cmdline: archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=floppy intel_iommu=on iommu=pt pcie_ports=compat cfg80211.ieee80211_regdom=US console=tty0 console=ttyS0,115200

/Install vinOS to disk  —  Apple T2 Mac (2018-2020)
    comment: full-screen installer on tty1, no desktop underneath
    protocol: linux
    kernel_path: boot():/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2
    module_path: boot():/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-t2.img
    kernel_cmdline: archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=floppy intel_iommu=on iommu=pt pcie_ports=compat cfg80211.ieee80211_regdom=US systemd.unit=vinos-installer.target console=tty0 console=ttyS0,115200

/Boot vinOS + persistence  —  Apple T2 Mac
    comment: changes survive reboot on a partition labelled vinos-persist
    protocol: linux
    kernel_path: boot():/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2
    module_path: boot():/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-t2.img
    kernel_cmdline: archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_device=/dev/disk/by-label/vinos-persist quiet splash loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=floppy intel_iommu=on iommu=pt pcie_ports=compat cfg80211.ieee80211_regdom=US console=tty0 console=ttyS0,115200

/Boot vinOS  —  Intel / AMD / generic PC
    comment: every non-Apple machine, and virtual machines
    protocol: linux
    kernel_path: boot():/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    module_path: boot():/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    kernel_cmdline: archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=floppy console=tty0 console=ttyS0,115200

/Install vinOS to disk  —  Intel / AMD / generic PC
    comment: full-screen installer on tty1, no desktop underneath
    protocol: linux
    kernel_path: boot():/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    module_path: boot():/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    kernel_cmdline: archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=floppy systemd.unit=vinos-installer.target console=tty0 console=ttyS0,115200

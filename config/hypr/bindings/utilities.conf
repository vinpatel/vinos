# Menus — three-tier discoverability:
#   SUPER+SPACE          → nwg-drawer (visual, glass, icon grid + search)
#   SUPER+SLASH          → walker (fast text-first search — power user)
#   SUPER+ALT+SPACE      → vinos-menu (settings/toggles swiss-army)
#   SUPER+K              → keybindings cheat sheet
#   SUPER+ESCAPE         → system menu (lock/logout/reboot/shutdown)
#
# nwg-drawer flags:
#   -g /etc/vinos/nwg-drawer/drawer.css   custom vinOS glass CSS
#   -is 72                                 72 px icons — feels roomy on 4K
#   -mt/mb/ml/mr                           full-screen inset padding
#   -c 6                                   6-column grid
#   -term foot                             default terminal for .desktop Exec=
#   -ovl                                   overlay mode (float above windows)
bind  = SUPER, SPACE, exec, nwg-drawer -g /etc/vinos/nwg-drawer/drawer.css -is 72 -mt 48 -mb 48 -ml 72 -mr 72 -c 6 -term foot -ovl
bind  = SUPER, SLASH, exec, walker
bind  = SUPER CTRL, E, exec, walker -m symbols
bind  = SUPER CTRL, C, exec, vinos-menu capture
bind  = SUPER CTRL, O, exec, vinos-menu toggle
bind  = SUPER CTRL, H, exec, vinos-menu hardware
bind  = SUPER ALT, SPACE, exec, vinos-menu
bind  = SUPER SHIFT, code:201, exec, vinos-menu
bind  = SUPER, ESCAPE, exec, vinos-menu system
bindl = , XF86PowerOff, exec, vinos-menu system
bind  = SUPER, K, exec, vinos-menu-keybindings
bind  = , XF86Calculator, exec, gnome-calculator

# Aesthetics
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, vinos-toggle-waybar
bindd = SUPER CTRL, SPACE, Theme background menu, exec, vinos-menu background
bindd = SUPER SHIFT CTRL, SPACE, Theme menu, exec, vinos-menu theme
bindd = SUPER, BACKSPACE, Toggle window transparency, exec, vinos-hyprland-window-transparency-toggle
bindd = SUPER SHIFT, BACKSPACE, Toggle window gaps, exec, vinos-hyprland-window-gaps-toggle
bindd = SUPER CTRL, BACKSPACE, Toggle single-window square aspect, exec, vinos-hyprland-window-single-square-aspect-toggle

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, vinos-toggle-notification-silencing
bindd = SUPER ALT, COMMA, Invoke last notification, exec, makoctl invoke
bindd = SUPER SHIFT ALT, COMMA, Restore last notification, exec, makoctl restore

# Toggles
bindd = SUPER CTRL, I, Toggle locking on idle, exec, vinos-toggle-idle
bindd = SUPER CTRL, N, Toggle nightlight, exec, vinos-toggle-nightlight
bindd = SUPER CTRL, Delete, Toggle laptop display, exec, vinos-hyprland-monitor-internal toggle
bindd = SUPER CTRL ALT, Delete, Toggle laptop display mirroring, exec, vinos-hyprland-monitor-internal-mirror toggle
bindl = , switch:on:Lid Switch, exec, vinos-hw-external-monitors && vinos-hyprland-monitor-internal off
bindl = , switch:off:Lid Switch, exec, vinos-hyprland-monitor-internal on

# Captures
# Primary bindings use PrintScreen — works on any PC keyboard. Mac
# users get parallel bindings on Cmd+Shift+3/4/5/6 below, matching
# macOS's own screenshot chord (Cmd → Super on our hid_apple config).
# MacBooks have no PrintScreen key, so the second set is mandatory
# for out-of-box parity, not a nice-to-have.
bindd = , PRINT, Screenshot, exec, vinos-capture-screenshot
bindd = ALT, PRINT, Screenrecording, exec, vinos-menu screenrecord
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a
bindd = SUPER CTRL, PRINT, Extract text (OCR) from screenshot, exec, vinos-capture-text-extraction

# Mac-friendly capture chords (no PrintScreen key on any MacBook):
# Cmd+Shift+3 → screenshot (macOS: full-screen)
# Cmd+Shift+4 → screenshot select area (macOS: crosshair-select)
# Cmd+Shift+5 → screenrecord (macOS: screen recording menu)
# Cmd+Shift+6 → color picker (arbitrary — no macOS analog)
# Cmd+Shift+7 → OCR (arbitrary — no macOS analog)
bindd = SUPER SHIFT, 3, Screenshot, exec, vinos-capture-screenshot
bindd = SUPER SHIFT, 4, Screenshot (region), exec, vinos-capture-screenshot region
bindd = SUPER SHIFT, 5, Screenrecording, exec, vinos-menu screenrecord
bindd = SUPER SHIFT, 6, Color picker, exec, pkill hyprpicker || hyprpicker -a
bindd = SUPER SHIFT, 7, Extract text (OCR) from screenshot, exec, vinos-capture-text-extraction

# File sharing
bindd = SUPER CTRL, S, Share, exec, vinos-menu share

# Transcoding
bindd = SUPER CTRL, PERIOD, Transcode, exec, vinos-transcode

# Reminders
bindd = SUPER CTRL, R, Set reminder, exec, vinos-menu reminder-set
bindd = SUPER CTRL ALT, R, Show reminders, exec, vinos-reminder show
bindd = SUPER SHIFT CTRL, R, Clear reminders, exec, vinos-reminder clear

# Waybar-less information
bindd = SUPER CTRL ALT, T, Show time, exec, notify-send -u low "    $(date +"%A %H:%M  ·  %d %B %Y  ·  Week %V")"
bindd = SUPER CTRL ALT, B, Show battery remaining, exec, notify-send -u low "$(vinos-battery-status)"
bindd = SUPER CTRL ALT, W, Show weather, exec, notify-send -u low "$(vinos-weather-status)"

# Control panels
bindd = SUPER CTRL, A, Audio controls, exec, vinos-launch-audio
bindd = SUPER CTRL, B, Bluetooth controls, exec, vinos-launch-bluetooth
bindd = SUPER CTRL, W, Wifi controls, exec, vinos-launch-wifi
bindd = SUPER CTRL, T, Activity, exec, vinos-launch-tui btop

# Dictation
bindd = SUPER CTRL, X, Toggle dictation, exec, voxtype record toggle

bindd  = , F9, Start dictation (push-to-talk), exec, voxtype record start
binddr = , F9, Stop dictation (push-to-talk),  exec, voxtype record stop

# Zoom
bindd = SUPER CTRL, Z, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bindd = SUPER CTRL ALT, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1

# Lock system
bindd = SUPER CTRL, L, Lock system, exec, vinos-system-lock

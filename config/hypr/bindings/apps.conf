# App-launch bindings.
#
# Uses `foot` directly (not `xdg-terminal-exec`). xdg-terminal-exec
# resolves the user's preferred terminal via ~/.config/xdg-terminals.list
# or system-wide fallback lists that ARE NOT seeded on a fresh live
# user. Result: the bind fires, xdg-terminal-exec finds nothing, and
# nothing happens (silent no-op). foot is in packages.x86_64 so it's
# always present.
#
# uwsm-app wrapper matches autostart.conf's pattern — every graphical
# app runs inside the uwsm session cgroup so systemd can track and
# reap it properly.

bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- foot
bindd = SUPER SHIFT, RETURN, Browser, exec, uwsm-app -- vinos-launch-browser
bindd = SUPER, N, Neovim, exec, uwsm-app -- foot -e nvim
bindd = SUPER, D, Lazy Docker, exec, uwsm-app -- foot -e lazydocker

# File manager. Skipping the vinos-cmd-terminal-cwd wrapper because
# hyprctl activewindow may return empty when no window is focused,
# and the wrapper's fallback path noise breaks nautilus argv.
bindd = SUPER ALT SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window

# NOTE: SUPER+T is Toggle floating (bindings/tiling-v2.conf line 8);
# SUPER+F is Full screen (line 9). btop lives under SUPER+CTRL+T
# ("Activity") in bindings/utilities.conf.

# App-launch bindings.
#
# Missing from v1.2.0 — SUPER+Return didn't open a terminal because
# neither bindings.conf nor plain-bindings.conf (which held the
# terminal binding) was sourced by hyprland.conf. Adding a dedicated
# apps.conf under bindings/ keeps the modular contract clean and
# fixes the regression.
#
# xdg-terminal-exec picks the user's preferred terminal from
# ~/.config/xdg-terminals.list; defaults to foot on this image.

bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(vinos-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, vinos-launch-browser
bindd = SUPER, N, Neovim, exec, uwsm-app -- xdg-terminal-exec -e nvim
bindd = SUPER, D, Lazy Docker, exec, uwsm-app -- xdg-terminal-exec -e lazydocker

# File manager at the terminal's current working directory.
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(vinos-cmd-terminal-cwd)"

# NOTE: SUPER+T is Toggle floating (bindings/tiling-v2.conf line 8);
# SUPER+F is Full screen (line 9). btop lives under SUPER+CTRL+T
# ("Activity") in bindings/utilities.conf.

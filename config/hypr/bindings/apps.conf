# App-launch bindings.
#
# v1.2.3 fixes over v1.2.2:
#   1. Keysym `RETURN` → `Return`. Hyprland 0.57's parser accepts
#      lowercase / mixed-case XKB names; the fully-uppercase `RETURN`
#      variant silently no-ops on our shipped build. `SUPER, Return`
#      is the canonical spelling everyone (Sway, Hyprland docs) uses.
#   2. Dropped the `uwsm-app --` wrapper on terminal launches. Under
#      certain uwsm session-bus races, `uwsm-app -- foot` fails to
#      spawn the child with no visible error, and there's no observable
#      benefit for foot (single-window, systemd tracks the shell). The
#      wrapper stays on longer-lived apps (nautilus, browser) where
#      cgroup scoping actually matters.
#   3. Uses `bind` (not `bindd`) — `bindd` includes a description arg
#      that a11y tools consume; nothing in vinOS reads it yet, and it
#      adds a parser surface for typos to silently no-op.

bind  = SUPER,        Return, exec, foot
bind  = SUPER SHIFT,  Return, exec, uwsm-app -- vinos-launch-browser
bind  = SUPER,        N,      exec, foot -e nvim
bind  = SUPER,        D,      exec, foot -e lazydocker

# File manager. Skipping the vinos-cmd-terminal-cwd wrapper because
# hyprctl activewindow may return empty when no window is focused,
# and the wrapper's fallback path noise breaks nautilus argv.
bind = SUPER ALT SHIFT, F, exec, uwsm-app -- nautilus --new-window

# NOTE: SUPER+T is Toggle floating (bindings/tiling-v2.conf line 8);
# SUPER+F is Full screen (line 9). btop lives under SUPER+CTRL+T
# ("Activity") in bindings/utilities.conf.

# vinOS Hyprland — minimal + verified. Everything inline. No sourced
# files. Add features back one at a time only after they're tested.
# The Omarchy-ported subdirs (apps/, bindings/, toggles/, plugins.conf)
# still exist in the repo but are NOT sourced by default because they
# have version-dependent syntax and broke on the shipped Hyprland.

# scale=auto lets Hyprland pick 1x/1.5x/2x per monitor DPI (4K laptops → 2x
# out of the box, 1080p desks → 1x). Override per-output with a second
# `monitor = HDMI-A-1,3840x2160,0x0,1.5` line if a machine needs it.
monitor = ,preferred,auto,auto

# --- Environment ---------------------------------------------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = GTK_THEME,Adwaita:dark

# --- Autostart -----------------------------------------------------
exec-once = mako
exec-once = waybar
# awww (formerly swww; Arch renamed the package 2026-05): daemon serves
# the wallpaper, `awww img` applies. Runs live-reload for vinos-theme.
# The short sleep gives awww-daemon time to bind its socket before
# `awww img` connects.
exec-once = awww-daemon
exec-once = sleep 0.3; awww img /usr/share/vinos/wallpaper.png --transition-type none
exec-once = walker --gapplication-service
exec-once = hypridle
exec-once = hyprsunset -t 4500
exec-once = swayosd-server
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = vinos-install-once
exec-once = vinos-hw-hints

# --- Look & feel ---------------------------------------------------
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(33ccffff) rgba(bb9af7ff) 45deg
    col.inactive_border = rgba(31314455)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.96
    fullscreen_opacity = 1.0
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000055)
    }
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        vibrancy = 0.15
        brightness = 0.92
    }
}

animations {
    enabled = yes
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = quick,        0.15, 0, 0.1, 1
    animation = windows,   1, 3.8, easeOutQuint
    animation = fade,      1, 3.0, quick
    animation = layers,    1, 3.8, easeOutQuint
    animation = workspaces, 1, 4.0, easeOutQuint
}

dwindle {
    preserve_split = true
    force_split = 2
}

input {
    kb_layout = us
    kb_options = compose:caps
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_scale_notification = true
    focus_on_activate = true
}

cursor {
    hide_on_key_press = true
}

xwayland {
    force_zero_scaling = true
}

# --- Window rules (Hyprland 0.55 match: syntax) --------------------
windowrule = suppress_event maximize, match:class .*
windowrule = float on,     match:class ^(org\.vinos\..*)$
windowrule = center on,    match:class ^(org\.vinos\..*)$
windowrule = size 900 640, match:class ^(org\.vinos\..*)$
windowrule = size 720 480, match:class ^(org\.vinos\.impala)$
windowrule = float on,     match:class ^(com\.gabm\.satty)$
windowrule = center on,    match:class ^(com\.gabm\.satty)$
windowrule = opacity 1 1,  match:class ^(mpv|vlc|imv)$

# --- Keybindings ---------------------------------------------------
$mainMod = SUPER

# App shortcuts
bind = $mainMod, Return, exec, foot
bind = $mainMod, Space,  exec, walker
bind = $mainMod, D,      exec, walker
bind = $mainMod, B,      exec, chromium
bind = $mainMod, E,      exec, nautilus
bind = $mainMod, Q,      killactive
bind = $mainMod SHIFT, E, exit
bind = $mainMod, F,      fullscreen
bind = $mainMod, V,      togglefloating

# AI (needs vinos-install-ai first)
bind = $mainMod, A,       exec, foot -T "vinOS AI" -e vinos-ai chat
bind = $mainMod SHIFT, A, exec, foot -T "Claude Code" -e claude

# Control panels + system
bind = $mainMod, L,       exec, hyprlock
bind = $mainMod SHIFT, C, exec, hyprpicker -a
bind = $mainMod CTRL, W,  exec, vinos-launch-wifi
bind = $mainMod CTRL, B,  exec, vinos-launch-bluetooth
bind = $mainMod CTRL, U,  exec, vinos-launch-audio
bind = $mainMod CTRL, O,  exec, vinos-menu
bind = $mainMod CTRL, T,  exec, vinos-theme --pick
bind = $mainMod CTRL, S,  exec, foot -T "vinOS doctor" -e vinos-doctor
bind = $mainMod, K,       exec, foot -T "Keybindings" -e less /usr/share/vinos/docs/KEYBINDINGS.txt
# Super+/ (and Super+? = Super+Shift+/) → live cheatsheet generated from
# this file. Floats via the generic org.vinos.* windowrule above.
bind = $mainMod, slash,       exec, vinos-cheatsheet
bind = $mainMod SHIFT, slash, exec, vinos-cheatsheet

# Screenshots
bind = $mainMod, P,       exec, grim -g "$(slurp)" - | satty -f - --copy-command wl-copy
bind = $mainMod SHIFT, P, exec, grim -g "$(slurp)" - | wl-copy && notify-send -a vinOS "Screenshot" "Copied"
bind = , PRINT,           exec, grim -g "$(slurp)" - | wl-copy

# Notifications
bind = $mainMod, COMMA,       exec, makoctl dismiss
bind = $mainMod SHIFT, COMMA, exec, makoctl dismiss --all

# Media keys
bindel = , XF86AudioRaiseVolume,  exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume,  exec, swayosd-client --output-volume lower
bindel = , XF86AudioMute,         exec, swayosd-client --output-volume mute-toggle
bindel = , XF86AudioMicMute,      exec, swayosd-client --input-volume mute-toggle
bindel = , XF86MonBrightnessUp,   exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPrev,  exec, playerctl previous

# Workspaces 1-9
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# vinOS Hyprland — modular source-in (activated 2026-08-09 by Pilot 1).
#
# The v1.1.0 "everything inline" approach kept the config working while
# the modular subdirs sat in the tree unused. Pilot 1 verified on this
# host (Hyprland 0.55.2, `Hyprland --verify-config`) that the modular
# layout parses clean with 222 bind entries active — activated here.
#
# Load order matters:
#   1. envs             — cursor + wayland + xwayland env
#   2. input            — kb_layout, touchpad, misc.dpms
#   3. looknfeel        — colors, borders, gaps, decoration, animations
#   4. autostart        — exec-once launcher line-up
#   5. windows          — window rules + apps.conf sourced tags
#   6. bindings/        — user keybindings (utilities, media, tiling, clipboard)
#
# Plugins live in plugins.conf but are NOT sourced by default — they
# depend on `hyprpm add ... && hyprpm enable ...` having succeeded.
# Users who install plugins uncomment the plugins.conf source line
# below.

monitor = ,preferred,auto,auto

# --- Modular sources ------------------------------------------------
source = ~/.config/hypr/envs.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/windows.conf

# Bindings — one file per intent.
source = ~/.config/hypr/bindings/apps.conf
source = ~/.config/hypr/bindings/utilities.conf
source = ~/.config/hypr/bindings/media.conf
source = ~/.config/hypr/bindings/tiling-v2.conf
source = ~/.config/hypr/bindings/clipboard.conf

# Plugins — opt-in. Uncomment after `hyprpm add https://github.com/hyprwm/hyprland-plugins`
# + `hyprpm enable hyprexpo borders-plus-plus hyprwinwrap && hyprctl reload`.
# source = ~/.config/hypr/plugins.conf

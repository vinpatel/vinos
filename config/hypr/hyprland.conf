# vinOS Hyprland config — sensible defaults for a live/desktop session.
# Rule 3: identity (wallpaper, logos) is set by 05-branding; this file
# is purely session/UX and stays fork-shadowable.

monitor = ,preferred,auto,1

$terminal = alacritty
$menu     = wofi --show drun
$notify   = mako

exec-once = mako
exec-once = waybar
exec-once = swaybg -i /usr/share/vinos/wallpaper.png -m fill || hyprctl hyprpaper reload

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct

general {
  gaps_in = 5
  gaps_out = 12
  border_size = 2
  col.active_border = rgba(33ccffee)
  col.inactive_border = rgba(595959aa)
  layout = dwindle
}

decoration {
  rounding = 6
  blur {
    enabled = true
    size = 4
    passes = 2
  }
  drop_shadow = false
}

animations {
  enabled = true
  bezier = ease, 0.25, 0.1, 0.25, 1
  animation = windows, 1, 4, ease
  animation = fade, 1, 5, ease
  animation = workspaces, 1, 4, ease
}

input {
  kb_layout = us
  follow_mouse = 1
  touchpad {
    natural_scroll = yes
  }
}

$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, E, exit
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating
bind = $mainMod, P, exec, grim -g "$(slurp)" - | wl-copy && notify-send "vinOS" "Screenshot copied"

# Workspaces 1..9
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Move windows with mouse drag.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

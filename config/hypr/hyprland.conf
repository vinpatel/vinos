# vinOS Hyprland config — sensible defaults for a live/desktop session.
# Rule 3: identity (wallpaper, logos) is set by 05-branding; this file
# is purely session/UX and stays fork-shadowable.

monitor = ,preferred,auto,1

$terminal = foot
$menu     = walker
$notify   = mako
$browser  = chromium

exec-once = mako
exec-once = waybar
exec-once = swaybg -i /usr/share/vinos/wallpaper.png -m fill
exec-once = walker --gapplication-service
exec-once = hypridle
exec-once = hyprsunset -t 4500
exec-once = swayosd-server
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# I11: first-boot bundle offer. Self-sentineled — safe on every login.
exec-once = vinos-install-once

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GTK_THEME,Adwaita:dark

general {
  gaps_in = 5
  gaps_out = 12
  border_size = 2
  col.active_border = rgba(33ccffee)
  col.inactive_border = rgba(595959aa)
  layout = dwindle
}

decoration {
  rounding = 6
  blur {
    enabled = true
    size = 4
    passes = 2
  }
}

animations {
  enabled = true
  bezier = ease, 0.25, 0.1, 0.25, 1
  animation = windows, 1, 4, ease
  animation = fade, 1, 5, ease
  animation = workspaces, 1, 4, ease
}

input {
  kb_layout = us
  follow_mouse = 1
  touchpad {
    natural_scroll = yes
  }
}

$mainMod = SUPER

# App shortcuts
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, SPACE,  exec, $menu
bind = $mainMod, D,      exec, $menu
bind = $mainMod, B,      exec, $browser
bind = $mainMod, E,      exec, nautilus
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, E, exit
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating

# Screenshot: satty pipeline (region → annotate → clipboard).
bind = $mainMod, P, exec, grim -g "$(slurp)" - | satty -f - --copy-command 'wl-copy' && notify-send "vinOS" "Screenshot annotated + copied"
# Quick region screenshot without annotate.
bind = $mainMod SHIFT, P, exec, grim -g "$(slurp)" - | wl-copy && notify-send "vinOS" "Screenshot copied"

# Lock, color picker, wifi, vinOS menu.
bind = $mainMod, L,       exec, hyprlock
bind = $mainMod SHIFT, C, exec, hyprpicker -a
bind = $mainMod CTRL, W,  exec, vinos-launch-wifi
bind = $mainMod CTRL, O,  exec, vinos-menu

# Volume + brightness via swayosd (shows OSD popup for feedback).
bindel = , XF86AudioRaiseVolume,  exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume,  exec, swayosd-client --output-volume lower
bindel = , XF86AudioMute,         exec, swayosd-client --output-volume mute-toggle
bindel = , XF86AudioMicMute,      exec, swayosd-client --input-volume mute-toggle
bindel = , XF86MonBrightnessUp,   exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPrev,  exec, playerctl previous

# Workspaces 1..9
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Move windows with mouse drag.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Window rules — floating TUIs (impala, satty).
windowrulev2 = float,           class:^(org.vinos.impala)$
windowrulev2 = size 720 480,    class:^(org.vinos.impala)$
windowrulev2 = center,          class:^(org.vinos.impala)$
windowrulev2 = float,           class:^(com.gabm.satty)$
windowrulev2 = center,          class:^(com.gabm.satty)$
windowrulev2 = float,           class:^(org.vinos.install)$
windowrulev2 = size 900 640,    class:^(org.vinos.install)$
windowrulev2 = center,          class:^(org.vinos.install)$
windowrulev2 = float,           class:^(org.vinos.doctor)$
windowrulev2 = size 900 640,    class:^(org.vinos.doctor)$
windowrulev2 = center,          class:^(org.vinos.doctor)$

# Walker/mako layer rules — no animations for launcher, gentle for notifications.
layerrule = no_anim on, namespace:^(walker)$

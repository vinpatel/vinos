# vinOS Hyprland config — sensible defaults for a live/desktop session.
# Rule 3: identity (wallpaper, logos) is set by 05-branding; this file
# is purely session/UX and stays fork-shadowable.

monitor = ,preferred,auto,1

$terminal = foot
$menu     = walker
$notify   = mako
$browser  = chromium

$activeBorder   = rgba(33ccffee) rgba(00ff99ee) 45deg
$inactiveBorder = rgba(595959aa)

# Autostart — mako, waybar, wallpaper, walker service, night light, OSD,
# polkit agent, first-boot bundle offer.
exec-once = mako
exec-once = waybar
exec-once = swaybg -i /usr/share/vinos/wallpaper.png -m fill
exec-once = walker --gapplication-service
exec-once = hypridle
exec-once = hyprsunset -t 4500
exec-once = swayosd-server
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = vinos-install-once

# --- Environment ----------------------------------------------------
# Force apps onto Wayland where they support it; fall back gracefully.
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = GTK_THEME,Adwaita:dark

# --- Look & feel ----------------------------------------------------
general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2
  col.active_border = $activeBorder
  col.inactive_border = $inactiveBorder
  resize_on_border = false
  allow_tearing = false
  layout = dwindle
}

decoration {
  rounding = 6
  shadow {
    enabled = true
    range = 2
    render_power = 3
    color = rgba(1a1a1aee)
  }
  blur {
    enabled = true
    size = 2
    passes = 2
    brightness = 0.6
    contrast = 0.75
  }
}

# Omarchy's animation set — smooth easeOutQuint transitions.
animations {
  enabled = yes
  bezier = easeOutQuint, 0.23, 1, 0.32, 1
  bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
  bezier = linear, 0, 0, 1, 1
  bezier = almostLinear, 0.5, 0.5, 0.75, 1
  bezier = quick, 0.15, 0, 0.1, 1

  animation = global, 1, 10, default
  animation = border, 1, 5.39, easeOutQuint
  animation = windows, 1, 3.79, easeOutQuint
  animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
  animation = windowsOut, 1, 1.49, linear, popin 87%
  animation = fadeIn, 1, 1.73, almostLinear
  animation = fadeOut, 1, 1.46, almostLinear
  animation = fade, 1, 3.03, quick
  animation = layers, 1, 3.81, easeOutQuint
  animation = layersIn, 1, 4, easeOutQuint, fade
  animation = layersOut, 1, 1.5, linear, fade
  animation = workspaces, 0, 0, ease
  animation = specialWorkspace, 1, 3, easeOutQuint, slidevert
}

dwindle {
  preserve_split = true
  force_split = 2
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  disable_scale_notification = true
  focus_on_activate = true
  key_press_enables_dpms = true
  mouse_move_enables_dpms = true
}

cursor {
  hide_on_key_press = true
  warp_on_change_workspace = 1
}

binds {
  hide_special_on_workspace_change = true
}

# --- Input ----------------------------------------------------------
input {
  kb_layout = us
  kb_options = compose:caps
  follow_mouse = 1
  sensitivity = 0
  touchpad {
    natural_scroll = yes
  }
}

xwayland {
  force_zero_scaling = true
}

# --- Keybinds -------------------------------------------------------
$mainMod = SUPER

# App shortcuts
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, SPACE,  exec, $menu
bind = $mainMod, D,      exec, $menu
bind = $mainMod, B,      exec, $browser
bind = $mainMod, E,      exec, nautilus
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, E, exit
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating

# Screenshot: satty pipeline (region → annotate → clipboard).
bind = $mainMod, P, exec, grim -g "$(slurp)" - | satty -f - --copy-command 'wl-copy' && notify-send "vinOS" "Screenshot annotated + copied"
bind = $mainMod SHIFT, P, exec, grim -g "$(slurp)" - | wl-copy && notify-send "vinOS" "Screenshot copied"

# Lock, color picker, wifi, vinOS menu.
bind = $mainMod, L,       exec, hyprlock
bind = $mainMod SHIFT, C, exec, hyprpicker -a
bind = $mainMod CTRL, W,  exec, vinos-launch-wifi
bind = $mainMod CTRL, O,  exec, vinos-menu

# Volume + brightness via swayosd.
bindel = , XF86AudioRaiseVolume,  exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume,  exec, swayosd-client --output-volume lower
bindel = , XF86AudioMute,         exec, swayosd-client --output-volume mute-toggle
bindel = , XF86AudioMicMute,      exec, swayosd-client --input-volume mute-toggle
bindel = , XF86MonBrightnessUp,   exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPrev,  exec, playerctl previous

# Workspaces 1..9
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Move windows with mouse drag.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Window rules ---------------------------------------------------
# Suppress maximize events (Hyprland handles them).
windowrule = suppress_event maximize, class:.*

# Tag "floating-window" — used by vinOS/omarchy-style TUIs to get a
# consistent modal-feeling float.
windowrule = tag +floating-window, class:^(org\.vinos\.impala|org\.vinos\.install|org\.vinos\.doctor|com\.gabm\.satty|Omarchy|About|TUI\.float|imv|mpv)$
windowrule = float,        tag:floating-window
windowrule = center,       tag:floating-window
windowrule = size 900 640, tag:floating-window

# Impala gets a tighter size.
windowrulev2 = size 720 480, class:^(org\.vinos\.impala)$

# Terminal styling — light transparency on inactive.
windowrule = tag +terminal, class:^(foot|Alacritty|kitty|com\.mitchellh\.ghostty)$
windowrule = opacity 0.97 0.9, tag:terminal

# No transparency for media windows.
windowrule = opacity 1 1, class:^(mpv|vlc|org\.kde\.kdenlive|com\.obsproject\.Studio|com\.github\.PintaProject\.Pinta|imv)$

# Walker: no launch animation (feels laggy with the popin curve).
layerrule = no_anim on, walker
layerrule = blur, walker
layerrule = ignorezero, walker

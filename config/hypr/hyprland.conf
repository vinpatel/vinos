# vinOS Hyprland — the whole desktop. Modular: apps.conf,
# bindings/*, toggles/*, autostart.conf, envs.conf, input.conf,
# looknfeel.conf, windows.conf, hyprlock.conf, hypridle.conf.
#
# See ATTRIBUTIONS.md for prior-art credits. vinOS layers AI-first
# bindings (Super+A chat, Super+Shift+A code) on the same base.

monitor = ,preferred,auto,1

# --- Variables ------------------------------------------------------
$terminal        = foot
$fileManager     = nautilus
$browser         = chromium
$music           = spotify
$messenger       = signal-desktop
$passwordManager = 1password
$menu            = walker

# --- Autostart ------------------------------------------------------
# Leaner subset — the modular autostart.conf we ported references
# helpers we don't ship yet, so we inline what we need.
exec-once = mako
exec-once = waybar
exec-once = swaybg -i /usr/share/vinos/wallpaper.png -m fill
exec-once = walker --gapplication-service
exec-once = hypridle
exec-once = hyprsunset -t 4500
exec-once = swayosd-server
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd --all
exec-once = vinos-install-once
exec-once = vinos-hw-hints

# --- Modular includes -----------------------------------------------
source = ~/.config/hypr/envs.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/windows.conf
source = ~/.config/hypr/apps.conf
source = ~/.config/hypr/plugins.conf

# --- Keybindings ----------------------------------------------------
$mainMod = SUPER

# Core app launches (bindd = binding with description, shows up in
# `hyprctl binds` and hyprland-guiutils' key-bindings viewer).
bindd = $mainMod, RETURN, Terminal,             exec, $terminal
bindd = $mainMod, F,      File manager,         exec, $fileManager
bindd = $mainMod, B,      Web browser,          exec, $browser
bindd = $mainMod, M,      Music,                exec, $music
bindd = $mainMod, G,      Messenger,            exec, $messenger
bindd = $mainMod, N,      Neovim in terminal,   exec, $terminal -e nvim
bindd = $mainMod, T,      Top,                  exec, $terminal -e btop
bindd = $mainMod, SLASH,  Password manager,     exec, $passwordManager

# Launcher + menus
bindd = $mainMod, SPACE,  Launch apps,          exec, walker
bindd = $mainMod, D,      Launch apps,          exec, walker
bindd = $mainMod SHIFT, SPACE, Toggle waybar,   exec, pkill -SIGUSR1 waybar
bindd = $mainMod CTRL, O, vinOS menu,           exec, vinos-menu
bindd = $mainMod ALT, SPACE, vinOS menu,        exec, vinos-menu
bindd = $mainMod, ESCAPE, System menu,          exec, vinos-menu
bindd = $mainMod CTRL, E, Emoji picker,         exec, walker -m symbols
bindd = $mainMod CTRL, V, Clipboard,            exec, walker -m clipboard
bindd = $mainMod, K,      Show keybindings,     exec, foot --app-id=org.vinos.help -T 'vinOS keybindings' -- less /usr/share/vinos/docs/KEYBINDINGS.txt

# AI (vinos-ai wraps ollama + claude-code + aichat)
bindd = $mainMod, A,       AI chat,             exec, foot --app-id=org.vinos.ai -T 'vinOS AI' -- vinos-ai chat
bindd = $mainMod SHIFT, A, AI code assistant,   exec, foot --app-id=org.vinos.ai -T 'Claude Code' -- claude
bindd = $mainMod CTRL, A,  AI models,           exec, foot --app-id=org.vinos.ai -T 'AI models' -- vinos-ai models

# Control panels
bindd = $mainMod CTRL, W, Wifi controls,        exec, vinos-launch-wifi
bindd = $mainMod CTRL, B, Bluetooth,            exec, vinos-launch-bluetooth
bindd = $mainMod CTRL, U, Audio,                exec, vinos-launch-audio
bindd = $mainMod CTRL, S, System diagnostics,   exec, foot --app-id=org.vinos.doctor -T 'vinOS doctor' -- vinos-doctor

# Themes
bindd = $mainMod CTRL, T, Switch theme,         exec, vinos-theme --pick

# Captures (grim + slurp; satty for annotate)
bindd = , PRINT,               Screenshot,      exec, grim -g "$(slurp)" - | wl-copy && notify-send -a vinOS "Screenshot" "Copied to clipboard"
bindd = SHIFT, PRINT,          Screenshot area annotate, exec, grim -g "$(slurp)" - | satty -f - --copy-command wl-copy
bindd = $mainMod, P,           Screenshot annotate, exec, grim -g "$(slurp)" - | satty -f - --copy-command wl-copy
bindd = $mainMod SHIFT, P,     Screenshot plain,    exec, grim -g "$(slurp)" - | wl-copy && notify-send -a vinOS "Screenshot" "Copied"
bindd = CTRL, PRINT,           Color picker,        exec, hyprpicker -a

# Notifications
bindd = $mainMod, COMMA,       Dismiss notification, exec, makoctl dismiss
bindd = $mainMod SHIFT, COMMA, Dismiss all,          exec, makoctl dismiss --all
bindd = $mainMod ALT, COMMA,   Invoke last,          exec, makoctl invoke

# Waybar-less info popups
bindd = $mainMod CTRL ALT, T, Show time, exec, notify-send -a vinOS -u low "  $(date +'%A %H:%M · %d %B %Y')"
bindd = $mainMod CTRL ALT, B, Show battery, exec, notify-send -a vinOS -u low "  Battery: $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)%"

# Zoom
bindd = $mainMod CTRL, Z,     Zoom in,          exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 0.5')
bindd = $mainMod CTRL ALT, Z, Reset zoom,       exec, hyprctl keyword cursor:zoom_factor 1

# Lock
bindd = $mainMod, L,          Lock,             exec, hyprlock

# Session
bindd = $mainMod, Q,          Kill focused,     killactive
bindd = $mainMod SHIFT, E,    Exit Hyprland,    exit
bindd = $mainMod, F11,        Fullscreen,       fullscreen
bindd = $mainMod, V,          Toggle floating,  togglefloating

# --- Media keys / laptop function row -------------------------------
bindeld = ,XF86AudioRaiseVolume,  Volume up,     exec, swayosd-client --output-volume raise
bindeld = ,XF86AudioLowerVolume,  Volume down,   exec, swayosd-client --output-volume lower
bindeld = ,XF86AudioMute,         Mute,          exec, swayosd-client --output-volume mute-toggle
bindeld = ,XF86AudioMicMute,      Mic mute,      exec, swayosd-client --input-volume mute-toggle
bindeld = ,XF86MonBrightnessUp,   Brightness+,   exec, swayosd-client --brightness raise
bindeld = ,XF86MonBrightnessDown, Brightness-,   exec, swayosd-client --brightness lower
bindld  = , XF86AudioPlay,  Play/pause, exec, playerctl play-pause
bindld  = , XF86AudioNext,  Next track, exec, playerctl next
bindld  = , XF86AudioPrev,  Prev track, exec, playerctl previous

# --- Workspaces -----------------------------------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

bind = $mainMod CTRL, Right, workspace, e+1
bind = $mainMod CTRL, Left,  workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# vinOS Hyprland plugins config. Sourced from hyprland.conf.
# Plugins are managed by hyprpm (ships with Hyprland). See
# install/02-desktop.sh for the installer-mode setup, or run manually:
#
#   hyprpm update
#   hyprpm add https://github.com/hyprwm/hyprland-plugins
#   hyprpm enable hyprexpo
#   hyprpm enable borders-plus-plus
#   hyprpm enable hyprwinwrap
#
# If the plugin isn't installed, Hyprland ignores the plugin { } block
# below (no error).

plugin {
  # hyprexpo — workspace overview (Mission Control-style).
  # Trigger: SUPER+TAB.
  hyprexpo {
    columns = 3
    gap_size = 6
    bg_col = rgb(1a1b26)
    workspace_method = center current   # or "first 1"
    enable_gesture = true               # touchpad swipe up = expo
    gesture_fingers = 3
    gesture_distance = 300
    gesture_positive = false
  }

  # borders-plus-plus — extra layered window borders for extra depth.
  # We use a single subtle inner border with a lighter tint.
  borders-plus-plus {
    add_borders = 1
    "col.border_1" = rgba(33ccff33)
    border_size_1  = 8
    natural_rounding = yes
  }

  # hyprwinwrap — turn any client into a live desktop background.
  # To use: launch `mpv --loop-file /path/to/video.mp4` with
  # `--x11-name=vinos-live-wallpaper`, then Hyprland will treat that
  # window as the desktop background.
  hyprwinwrap {
    class = ^(vinos-live-wallpaper)$
  }
}

# Bindings for plugin features.
bind = SUPER, TAB,   hyprexpo:expo, toggle
bind = SUPER, grave, hyprexpo:expo, toggle   # SUPER+backtick

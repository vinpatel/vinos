# vinOS Hyprland plugins config. Sourced from hyprland.conf.
# Plugins are managed by hyprpm (ships with Hyprland). To enable:
#
#   hyprpm update
#   hyprpm add https://github.com/hyprwm/hyprland-plugins
#   hyprpm enable hyprexpo
#   hyprpm enable borders-plus-plus
#   hyprpm enable hyprwinwrap
#   hyprctl reload
#
# The `hyprlang noerror` directives below silence errors from the
# plugin config when the plugins aren't installed yet (e.g. on the
# live ISO or a fresh install where hyprpm hasn't run). Once the
# plugins ARE installed, the same config activates them.

# hyprlang noerror true

plugin {
  # hyprexpo — workspace overview (Mission Control-style).
  hyprexpo {
    columns = 3
    gap_size = 6
    bg_col = rgb(1a1b26)
    workspace_method = center current
    enable_gesture = true
    gesture_fingers = 3
    gesture_distance = 300
    gesture_positive = false
  }

  # borders-plus-plus — extra layered window borders.
  borders-plus-plus {
    add_borders = 1
    "col.border_1" = rgba(33ccff33)
    border_size_1  = 8
    natural_rounding = yes
  }

  # hyprwinwrap — turn any client into a live desktop background.
  # Launch mpv/imv with `--x11-name=vinos-live-wallpaper` to use.
  hyprwinwrap {
    class = ^(vinos-live-wallpaper)$
  }
}

# Bindings for plugin dispatchers. These silently no-op if the plugin
# isn't loaded (thanks to the noerror wrapper).
bind = SUPER, TAB,   hyprexpo:expo, toggle
bind = SUPER, grave, hyprexpo:expo, toggle

# hyprlang noerror false

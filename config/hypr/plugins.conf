# vinOS Hyprland plugins config — Track R (v1.3.0) landed 2026-08-15.
# Plugins are pre-installed by install/02-desktop.sh via hyprpm at
# first-boot so users don't hyprpm add manually.
#
# Sourced from hyprland.conf. If a plugin isn't installed yet, hyprlang
# noerror wrappers stop the config from erroring — the config still
# activates automatically once the plugin is loaded.

# hyprlang noerror true

# --- borders-plus-plus: multi-layer gradient borders ---
plugin {
  borders-plus-plus {
    add_borders = 2
    "col.border_1" = rgb(bb9af7)
    "col.border_2" = rgb(7aa2f7)
    border_size_1 = 3
    border_size_2 = 1
    natural_rounding = yes
  }
}

# --- hyprbars: window title bars ---
plugin {
  hyprbars {
    bar_height = 26
    bar_color = rgba(1a1b26cc)
    "col.text" = rgb(c0caf5)
    bar_text_font = JetBrainsMono Nerd Font
    bar_text_size = 11
    bar_padding = 10
    bar_button_padding = 8
    bar_precedence_over_border = false
    hyprbars-button = rgb(f7768e), 14, , hyprctl dispatch killactive
    hyprbars-button = rgb(e0af68), 14, , hyprctl dispatch fullscreen 1
    hyprbars-button = rgb(9ece6a), 14, , hyprctl dispatch fullscreen 0
  }
}

# --- hyprfocus: subtle focus animation ---
plugin {
  hyprfocus {
    enabled = yes
    animate_floating = yes
    animate_workspacechange = yes
    focus_animation = shrink
    bezier = bezIn, 0.5, 0.0, 1.0, 0.5
    bezier = bezOut, 0.0, 0.5, 0.5, 1.0
    shrink {
      shrink_percentage = 0.98
      in_bezier = bezIn
      in_speed = 1
      out_bezier = bezOut
      out_speed = 2
    }
  }
}

# --- hyprexpo: workspace overview (installed opt-in, not on official repo yet) ---
plugin {
  hyprexpo {
    columns = 3
    gap_size = 6
    bg_col = rgb(1a1b26)
    workspace_method = center current
    enable_gesture = true
    gesture_fingers = 3
    gesture_distance = 300
    gesture_positive = false
  }
}

# --- hyprwinwrap: live wallpapers (installed opt-in) ---
plugin {
  hyprwinwrap {
    class = ^(vinos-live-wallpaper)$
  }
}

# Bindings — silently no-op if plugin not loaded
bind = SUPER, TAB,   hyprexpo:expo, toggle
bind = SUPER, grave, hyprexpo:expo, toggle

# hyprlang noerror false

# vinOS hyprlock — minimal lock screen with wallpaper + password field.
background {
  monitor =
  path    = /usr/share/vinos/wallpaper.png
  blur_passes = 2
  blur_size = 4
}

input-field {
  monitor       =
  size          = 320, 48
  outline_thickness = 2
  dots_size     = 0.28
  dots_spacing  = 0.35
  outer_color   = rgba(33ccffee)
  inner_color   = rgba(1a1b26ee)
  font_color    = rgb(c0caf5)
  fade_on_empty = true
  placeholder_text = <i>vinOS locked — password</i>
  hide_input    = false
  position      = 0, -80
  halign        = center
  valign        = center
}

label {
  monitor  =
  text     = cmd[update:1000] echo "$(date +'%H:%M')"
  color    = rgba(c0caf5ff)
  font_size = 84
  font_family = JetBrainsMono Nerd Font
  position = 0, 220
  halign   = center
  valign   = center
}

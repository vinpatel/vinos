# vinOS hyprlock — cinematic lock screen. Blurred wallpaper as
# background, giant JetBrainsMono clock, subtle vinOS wordmark
# lower-right, animated input field.

general {
  disable_loading_bar = true
  grace = 2
  hide_cursor = true
  no_fade_in = false
  no_fade_out = false
  ignore_empty_input = true
}

background {
  monitor =
  path    = /usr/share/vinos/wallpaper.png
  blur_passes = 4
  blur_size   = 8
  contrast    = 0.9
  brightness  = 0.7
  vibrancy    = 0.17
  vibrancy_darkness = 0.05
}

# Huge clock, top-middle third of the screen.
label {
  monitor  =
  text     = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
  color    = rgba(c0caf5ff)
  font_size = 128
  font_family = JetBrainsMono Nerd Font ExtraBold
  position = 0, 140
  halign   = center
  valign   = center
  shadow_passes = 3
  shadow_size = 6
  shadow_color = rgba(00000088)
}

# Date, just below the clock.
label {
  monitor  =
  text     = cmd[update:60000] echo "$(date +'%A, %-d %B')"
  color    = rgba(a9b1d6cc)
  font_size = 20
  font_family = JetBrainsMono Nerd Font
  position = 0, 20
  halign   = center
  valign   = center
}

# Greeting (uses whoami — resolves to `vin` on the live user).
label {
  monitor  =
  text     = cmd[update:0] echo "welcome back, $(whoami)"
  color    = rgba(7dcfffcc)
  font_size = 15
  font_family = JetBrainsMono Nerd Font
  position = 0, -60
  halign   = center
  valign   = center
}

# Input field — pill shape, mint border, blurred.
input-field {
  monitor       =
  size          = 360, 56
  outline_thickness = 2
  dots_size     = 0.3
  dots_spacing  = 0.35
  dots_center   = true
  outer_color   = rgba(33ccffcc)
  inner_color   = rgba(1a1b2699)
  font_color    = rgb(c0caf5)
  fade_on_empty = false
  placeholder_text = <i>enter password</i>
  hide_input    = false
  rounding      = 28
  position      = 0, -140
  halign        = center
  valign        = center
  shadow_passes = 2
  shadow_size   = 4
  shadow_color  = rgba(00000066)
  check_color   = rgba(9ece6acc)
  fail_color    = rgba(f7768ecc)
  fail_text     = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = rgba(e0af68cc)
}

# vinOS wordmark, bottom-right.
label {
  monitor  =
  text     = vinOS
  color    = rgba(565f89aa)
  font_size = 14
  font_family = JetBrainsMono Nerd Font
  position = -32, 32
  halign   = right
  valign   = bottom
}

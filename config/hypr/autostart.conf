# Skip idle-lock on the live medium — /run/archiso exists only when
# booted from the ISO. Installed systems still get hypridle + hyprlock.
# Without this, a QEMU test session locks after 5 min and the live user
# (empty password) cannot unlock via PAM — forcing a reboot mid-test.
exec-once = sh -c '[ ! -e /run/archiso ] && uwsm-app -- hypridle'
exec-once = uwsm-app -- mako
exec-once = ! vinos-toggle-enabled waybar-off && uwsm-app -- waybar
exec-once = uwsm-app -- fcitx5 --disable notificationitem
# Wallpaper: point at the system-installed symlink (populated by
# install/05-branding.sh → themes/aurora/wallpaper.png by default).
# The previous path (~/.config/vinos/theme/background) is NOT seeded
# on a fresh user home, which crashed swaybg → blank screen. The
# /usr/share/vinos/wallpaper.png symlink always exists on the ISO.
# R7 — live wallpaper via awww (successor of swww). Runs a daemon +
# vinos-wallpaper-cycle rotates through the 4 themes with wave transitions
# every 90 s. Falls back to fade if vinos-toggle-enabled reduced-motion.
# swaybg was the static baseline (v1.2.x); kept commented for rollback.
# exec-once = uwsm-app -- swaybg -i /usr/share/vinos/wallpaper.png -m fill
exec-once = awww-daemon
exec-once = sleep 3 && awww img /usr/share/vinos/wallpaper.png --transition-type fade --transition-duration 1
exec-once = sleep 8 && vinos-wallpaper-cycle 90 wave

# R8 — hyprsunset for color temperature, then vinos-display auto so the
# machine wakes up with a sensible temperature-by-time-of-day setting.
exec-once = hyprsunset
exec-once = sleep 5 && vinos-display auto

# R1 — first-boot Hyprland plugin build via hyprpm. Guarded by state
# flag so it never runs twice. Takes 1-3 min on first boot only.
# Skipped on live ISO to avoid spending live-boot cycles on it.
exec-once = sh -c '[ ! -e /run/archiso ] && vinos-hypr-plugin-setup'
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# elephant is walker 2.16+'s data-provider backend. Bindings launch
# walker one-shot on Super+Space; walker fails on backend init if
# elephant isn't already up. Keep this above vinos-first-run so the
# launcher works before any post-boot prompts fire.
exec-once = uwsm-app -- elephant
exec-once = vinos-first-run
exec-once = vinos-powerprofiles-init
exec-once = uwsm-app -- vinos-hyprland-monitor-watch

# Slow app launch fix -- set systemd vars
exec-once = systemctl --user import-environment $(env | cut -d'=' -f 1)
exec-once = dbus-update-activation-environment --systemd --all

# Belt-and-suspenders TZ autodetect: if vinos-tzdetect.service (boot-time)
# couldn't reach the geoip API before greetd's 30 s wait expired, this
# retry runs once the desktop is up — Wi-Fi is almost certainly solid by
# now. Guarded on the sentinel so it's a no-op when tzdetect already
# succeeded (or the user manually picked a TZ).
exec-once = sh -c '[ ! -f /var/lib/vinos/tzdetect.done ] && sudo -n /usr/bin/tzupdate 2>&1 | logger -t hypr-tzupdate || true'

# Install-to-disk auto-launch: the "Install vinOS to disk" boot entries
# pass vinos.install=1 on the kernel cmdline. When set, vinos-install-
# launcher pops impala for Wi-Fi (if no route yet), waits for a default
# route, THEN opens vinos-install-disk. No-op if flag absent.
exec-once = sh -c 'grep -q "vinos.install=1" /proc/cmdline && vinos-install-launcher || true'

# Run post-boot hooks after startup config has loaded
exec-once = sleep 2 && vinos-hook post-boot

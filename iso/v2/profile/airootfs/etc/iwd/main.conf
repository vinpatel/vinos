# vinOS iwd config — live ISO copy. Mirrors what install/04-services.sh
# writes to the target on install. Country=US pins the regulatory domain
# so 5GHz channels come up on first scan (wireless-regdb ships alongside).
# EnableNetworkConfiguration is intentionally *not* set: systemd-networkd
# owns DHCP via /etc/systemd/network/20-wlan.network — iwd's built-in DHCP
# races the T2 brcmfmac driver.
[General]
Country=US

[Network]
NameResolvingService=systemd

[Settings]
AutoConnect=true

# Modules for Apple T2 Macs. All harmless on non-Apple hardware.
#   applespi + spi_pxa2xx_platform + intel_lpss + intel_lpss_pci:
#     internal keyboard from early boot (trackpad's own driver
#     inits without this).
#   brcmfmac: T2 Wi-Fi (BCM4364/BCM4377). Baking it into initramfs
#     ensures the driver + apple-bcm-firmware are live before iwd
#     starts on the live medium — this is the fix for missing wifi
#     on first-boot USB on 2019 T2 MacBook Pro.
#   apple_bce: T2 USB/audio/touchpad tunnel over VHCI.
#   hci_bcm4377: T2 Bluetooth.
#   hid_apple + hid_generic + usbhid + xhci_pci + xhci_hcd:
#     internal keyboard + external USB from earliest boot (before udev).
# apple_ibridge/apple_ib_tb (Touch Bar) intentionally omitted — no
# longer in linux-t2 upstream; Touch Bar is userspace (tiny-dfr).
MODULES=(applespi spi_pxa2xx_platform intel_lpss intel_lpss_pci brcmfmac apple_bce hci_bcm4377 hid_apple hid_generic usbhid xhci_pci xhci_hcd)
HOOKS=(base udev microcode modconf kms keyboard plymouth memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)

# vinOS: T2 Mac modules to auto-load on the running system. brcmfmac
# is the T2 Wi-Fi driver (BCM4364/BCM4377); hci_bcm4377 is T2 Bluetooth;
# apple_bce carries the T2 USB/audio tunnel. All are no-ops on non-Apple
# hardware. Baked into the airootfs so first-boot USB has wifi + BT.
brcmfmac
hci_bcm4377
apple_bce

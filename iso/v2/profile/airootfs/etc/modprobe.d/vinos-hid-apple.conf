# vinOS T2 Mac keyboard defaults.
# iso_layout=0     — US layout (< key next to Enter). Change to 1 for
#                    ISO layout (< key next to Shift) if in Europe.
# fnmode=2         — media keys (brightness/volume) are primary,
#                    F1-F12 accessible with Fn. Matches macOS default.
# swap_opt_cmd=0   — Mac-native mapping: Command (⌘) acts as Super
#                    (Hyprland's $mainMod), Option (⌥) acts as Alt.
#                    So ⌘+Space opens walker (Spotlight-like), ⌘+Return
#                    opens foot, etc. Set to 1 for PC-layout parity.
options hid_apple iso_layout=0 fnmode=2 swap_opt_cmd=0

# Allow systemd-networkd-wait-online to succeed as soon as ONE interface
# is online (--any). On T2 MacBooks the brcmfmac Wi-Fi driver takes 5-20 s
# to associate + DHCP after iwd starts; --any lets us proceed the moment
# it's ready. --timeout=15 caps offline-boot stall at 15 s (vs. the
# default 120 s) — enough for T2 Wi-Fi to associate, short enough that
# a truly offline machine isn't stuck for 2 minutes.
# See https://wiki.archlinux.org/title/systemd-networkd#systemd-networkd-wait-online
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=15

# vinOS container / k8s tuning — pinned at boot
# See docs/spec/b-k8s-optimized.md · harness check #60

# Bridge netfilter — required by kube-proxy + docker bridge networking
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# Kubelet expectations
vm.overcommit_memory = 1
vm.panic_on_oom = 0

# File watchers (webpack, prometheus, kubectl watchers)
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 8192

# Large memory maps (JVM, elasticsearch, ollama with large models)
vm.max_map_count = 262144

# Ephemeral port range (dev apps with lots of outbound conns)
net.ipv4.ip_local_port_range = 32768 65535

# TCP keepalive (gRPC, model streaming, long polls)
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 6

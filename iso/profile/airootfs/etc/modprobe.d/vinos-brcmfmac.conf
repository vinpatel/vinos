# vinOS: T2 MacBook Wi-Fi stability — the linux-t2 project's recipe, applied on the live
# medium. Without this mask, brcmfmac disassociates repeatedly on 5GHz APs
# on 2018+ T2 Macs (BCM4364/BCM4377). Root cause of "Operation failed" in
# impala on first-boot USB. Post-install install/06-hardware.sh writes the
# same file to /etc/modprobe.d/vinos-brcmfmac.conf on the target.
options brcmfmac feature_disable=0x82000

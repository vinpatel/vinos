# vinOS T2 Mac keyboard defaults.
# iso_layout=0     — US layout (< key next to Enter). Change to 1 for
#                    ISO layout (< key next to Shift) if in Europe.
# fnmode=2         — media keys (brightness/volume) are primary,
#                    F1-F12 accessible with Fn. Matches macOS default.
# swap_opt_cmd=1   — Option acts as Alt, Command acts as Super (Meta),
#                    so muscle memory maps: Command-C → Ctrl-C in
#                    non-Cmd apps; Command as Hyprland's $mainMod.
options hid_apple iso_layout=0 fnmode=2 swap_opt_cmd=1

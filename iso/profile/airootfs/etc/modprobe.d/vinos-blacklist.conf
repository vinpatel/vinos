# vinOS: blacklist rarely-used kernel modules with known CVEs or
# unmaintained code paths. Reduces attack surface at zero cost to
# typical users. See docs/spec/b-secure-kernel.md · harness check #53

# Network protocols not used by 99% of users, sources of CVE churn
blacklist dccp
blacklist sctp
blacklist rds
blacklist tipc

# Legacy / rare filesystems — mount attack vectors
blacklist cramfs
blacklist freevxfs
blacklist jffs2
blacklist hfs
blacklist hfsplus
blacklist udf

# Firewire (targeted DMA attack potential; no one uses it in 2026)
blacklist firewire-core
blacklist firewire-ohci
blacklist firewire-sbp2

# Bluetooth handling — keep bluetooth core but block old obsolete drivers
# (real bluetooth still works via btusb + bluetooth)
blacklist bluetooth_6lowpan

# Uncommon USB drivers — reduce autoload risk from bad USB devices
blacklist usb-storage-noopcode

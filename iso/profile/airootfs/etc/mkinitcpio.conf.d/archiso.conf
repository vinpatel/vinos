# Modules for Apple T2 Macs: applespi drives the internal keyboard,
# spi_pxa2xx_platform + intel_lpss + intel_lpss_pci are its dependencies.
# Loading them in initramfs is what makes the T2 keyboard work from
# early boot instead of "never" (trackpad happens to work without
# this because it's a separate SPI slave with a different driver).
# apple_ibridge/apple_ib_tb are for the Touch Bar. cs42l83 is the
# audio codec on 2018+ Macs. All harmless on non-Apple hardware.
MODULES=(applespi spi_pxa2xx_platform intel_lpss intel_lpss_pci apple_ibridge apple_ib_tb)
HOOKS=(base udev microcode modconf kms keyboard plymouth memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)

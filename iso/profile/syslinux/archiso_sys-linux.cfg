LABEL arch
TEXT HELP
vinOS on Intel / AMD / generic PCs (BIOS boot).
For Apple T2 Macs, arrow-down to the "Apple T2 Mac" entry.
ENDTEXT
MENU LABEL vinOS — Intel / AMD / generic PC  (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux

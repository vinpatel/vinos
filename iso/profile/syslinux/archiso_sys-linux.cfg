# vinOS boot menu — BIOS (syslinux). Mirrors the systemd-boot layout at
# iso/profile/efiboot/loader/entries/. Five entries only: T2 boot, T2
# install, T2 + persistence, generic PC boot, generic PC install.

LABEL vinosT2
TEXT HELP
Recommended for Apple 2018-2020 T2 Macs (MBP / MBA / iMac Pro / iMac /
Mac mini). linux-t2 kernel — internal keyboard, trackpad, Wi-Fi, audio,
Touch Bar, and fan control all work from the live session.
ENDTEXT
MENU LABEL ➜  Boot vinOS  —  Apple T2 Mac (2018-2020)
MENU DEFAULT
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-t2.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=floppy intel_iommu=on iommu=pt pcie_ports=compat console=tty0 console=ttyS0,115200

LABEL vinosInstallT2
TEXT HELP
Install vinOS to disk on an Apple T2 Mac. Boots the live session with
a flag that auto-launches the installer once the desktop appears.
ENDTEXT
MENU LABEL ⚙  Install vinOS to disk  —  Apple T2 Mac
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-t2.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=floppy intel_iommu=on iommu=pt pcie_ports=compat vinos.install=1 console=tty0 console=ttyS0,115200

LABEL vinosT2Persist
TEXT HELP
Boot vinOS on an Apple T2 Mac with persistence. Requires the
vinos-persist partition (iso/flash.sh creates it by default).
ENDTEXT
MENU LABEL ●  Boot vinOS + persistence  —  Apple T2 Mac
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-t2.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_device=/dev/disk/by-label/vinos-persist quiet splash loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=floppy intel_iommu=on iommu=pt pcie_ports=compat console=tty0 console=ttyS0,115200

LABEL vinos
TEXT HELP
Live vinOS on Intel / AMD / generic PCs (BIOS boot). For Apple T2 Macs
use the entry above.
ENDTEXT
MENU LABEL ➜  Boot vinOS  —  Intel / AMD / generic PC
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=floppy console=tty0 console=ttyS0,115200

LABEL vinosInstall
TEXT HELP
Install vinOS to disk on an Intel / AMD / generic PC. Boots the live
session with a flag that auto-launches the installer once the desktop
appears.
ENDTEXT
MENU LABEL ⚙  Install vinOS to disk  —  Intel / AMD / generic PC
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=floppy vinos.install=1 console=tty0 console=ttyS0,115200

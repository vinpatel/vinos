LABEL arch
TEXT HELP
Boot vinOS Live on BIOS.
Try vinOS without installing, or use vinos-install-disk to make it permanent.
ENDTEXT
MENU LABEL Boot vinOS (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0 console=ttyS0,115200

# Safe-graphics fallback (Rule 1 escape hatch on quirky GPUs).
LABEL archsafe
TEXT HELP
Boot vinOS Live on BIOS with nomodeset (safe graphics fallback).
ENDTEXT
MENU LABEL Boot vinOS (safe graphics, nomodeset)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset console=tty0 console=ttyS0,115200

# Accessibility boot option.
LABEL archspeech
TEXT HELP
Boot vinOS Live on BIOS with the speakup screen reader enabled.
ENDTEXT
MENU LABEL Boot vinOS with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on console=tty0 console=ttyS0,115200

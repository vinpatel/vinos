LABEL arch
TEXT HELP
vinOS on Intel / AMD / generic PCs (BIOS boot).
For Apple T2 Macs, arrow-down to the "Apple T2 Mac" entry.
ENDTEXT
MENU LABEL vinOS — Intel / AMD / generic PC  (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=floppy console=tty0 console=ttyS0,115200

# I12: Apple T2 Mac (2018-2020 MBP/MBA/iMacPro/MacMini).
# linux-t2 kernel + apple-bcm-firmware + apple-t2-audio-config land
# internal keyboard, trackpad, wifi, audio, and GPU handoff from the
# live USB. hid_apple.iso_layout defaults to US; adjust post-install
# via /etc/modprobe.d/ for other layouts.
LABEL archt2
TEXT HELP
Recommended for Apple 2018-2020 T2 Macs (MBP/MBA/iMac Pro/Mini/iMac).
Uses the linux-t2 kernel so internal keyboard, trackpad, wifi, audio
and GPU handoff all work from the live session.
ENDTEXT
MENU LABEL ➜  vinOS — Apple T2 Mac  (2018-2020 MBP/MBA/iMac Pro)
MENU DEFAULT
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-t2.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=floppy intel_iommu=on iommu=pt console=tty0 console=ttyS0,115200

# Safe-graphics fallback (Rule 1 escape hatch on quirky GPUs).
LABEL archsafe
TEXT HELP
Boot vinOS Live on BIOS with nomodeset (safe graphics fallback).
ENDTEXT
MENU LABEL Boot vinOS (safe graphics, nomodeset)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset console=tty0 console=ttyS0,115200

# Persistent COW option. Requires a partition labelled vinos-persist on
# the USB (created by iso/flash.sh --with-persistence).
LABEL archpersist
TEXT HELP
Boot vinOS Live with persistent home + system changes backed by
/dev/disk/by-label/vinos-persist. Requires flash.sh --with-persistence.
ENDTEXT
MENU LABEL Boot vinOS (persistent)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_device=/dev/disk/by-label/vinos-persist quiet splash loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=floppy console=tty0 console=ttyS0,115200

# Accessibility boot option.
LABEL archspeech
TEXT HELP
Boot vinOS Live on BIOS with the speakup screen reader enabled.
ENDTEXT
MENU LABEL Boot vinOS with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on console=tty0 console=ttyS0,115200

# Install directly to disk — skips the live desktop entirely and lands in the
# installer TUI on tty1. Kernel cmdline flag vinos.action=install triggers
# vinos-installer-autolaunch.service on boot.
LABEL archinstall_t2
TEXT HELP
Install vinOS to internal disk. Skips the live desktop and drops
you straight into the guided installer. Recommended for T2 Macs.
ENDTEXT
MENU LABEL ⚡ Install vinOS to disk  (Apple T2 Mac)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-t2.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% vinos.action=install quiet splash loglevel=3 modprobe.blacklist=floppy intel_iommu=on iommu=pt console=tty0 console=ttyS0,115200

LABEL archinstall_generic
TEXT HELP
Install vinOS to internal disk on Intel / AMD / generic PCs.
Skips the live desktop and drops you into the guided installer.
ENDTEXT
MENU LABEL ⚡ Install vinOS to disk  (Intel / AMD / generic PC)

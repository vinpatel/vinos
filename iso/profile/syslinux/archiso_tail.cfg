# vinOS boot menu — power/reboot only. Memtest + HDT + "Boot existing OS"
# removed for a cleaner first impression (5 vinOS entries at the top +
# 2 power items here = 7 total on BIOS). Advanced users can drop to the
# syslinux command line (Tab) if they need memtest, HDT, or chainload.

LABEL reboot
TEXT HELP
Reboot the computer.
ENDTEXT
MENU LABEL Reboot
COM32 reboot.c32

LABEL poweroff
TEXT HELP
Power off the computer.
ENDTEXT
MENU LABEL Power Off
COM32 poweroff.c32

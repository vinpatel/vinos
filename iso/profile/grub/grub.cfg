# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Use graphics-mode output
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output console
fi

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Set default menu entry
default=vinos-t2
timeout=10
timeout_style=menu


# Menu entries — 5 vinOS boot options + power items below. Match the
# systemd-boot layout at iso/profile/efiboot/loader/entries/.

menuentry "➜  Boot vinOS  —  Apple T2 Mac (2018-2020)" --hotkey t --class arch --class gnu-linux --class gnu --class os --id 'vinos-t2' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2 archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=floppy intel_iommu=on iommu=pt pcie_ports=compat console=tty0 console=ttyS0,115200
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-t2.img
}

menuentry "⚙  Install vinOS to disk  —  Apple T2 Mac" --hotkey i --class arch --class gnu-linux --class gnu --class os --id 'vinos-install-t2' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2 archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=floppy intel_iommu=on iommu=pt pcie_ports=compat systemd.unit=vinos-installer.target console=tty0 console=ttyS0,115200
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-t2.img
}

menuentry "●  Boot vinOS + persistence  —  Apple T2 Mac" --hotkey p --class arch --class gnu-linux --class gnu --class os --id 'vinos-t2-persist' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2 archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_device=/dev/disk/by-label/vinos-persist quiet splash loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=floppy intel_iommu=on iommu=pt pcie_ports=compat console=tty0 console=ttyS0,115200
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-t2.img
}

menuentry "➜  Boot vinOS  —  Intel / AMD / generic PC" --class arch --class gnu-linux --class gnu --class os --id 'vinos-pc' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=floppy console=tty0 console=ttyS0,115200
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "⚙  Install vinOS to disk  —  Intel / AMD / generic PC" --class arch --class gnu-linux --class gnu --class os --id 'vinos-install-pc' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 vt.global_cursor_default=0 modprobe.blacklist=floppy systemd.unit=vinos-installer.target console=tty0 console=ttyS0,115200
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}


# Advanced options (memtest, UEFI shell, firmware settings) intentionally
# removed for a cleaner first impression. Users who need them can edit
# grub.cfg from a shipped vinOS terminal.

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}


# GRUB init tune for accessibility
play 600 988 1 1319 4

title    ⚡  Install vinOS to disk  (Intel / AMD / generic PC — guided)
sort-key 0-install-b
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% vinos.action=install quiet splash loglevel=3 modprobe.blacklist=floppy console=tty0 console=ttyS0,115200

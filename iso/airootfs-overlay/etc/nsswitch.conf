# vinOS live ISO — nsswitch with mDNS/.local resolution wired in
# (nss-mdns) so networked printers and Bonjour hosts resolve on first
# boot. Matches Arch defaults except for the `hosts:` line.
passwd: files systemd
group: files [SUCCESS=merge] systemd
shadow: files systemd
gshadow: files systemd

publickey: files

hosts: mymachines mdns_minimal [NOTFOUND=return] resolve [!UNAVAIL=return] files myhostname dns
networks: files

protocols: files
services: files
ethers: files
rpc: files

netgroup: files

# vinOS live-medium sshd config (Q6, 2026-08-14).
#
# Applies ONLY on the live ISO. The disk installer replaces this file
# (see install/04-services.sh) with a stricter config where password
# auth is opt-in and empty passwords are rejected.
#
# WHY these choices:
#   The live user `vinos` is created with an empty password by
#   vinos-live-init.service (see iso/airootfs-overlay/etc/systemd/system/vinos-live-init.service).
#   The whole point of the live ISO is to boot-and-poke without any
#   credential setup. For iso/qa/loop.sh to hot-patch config into the
#   guest via ssh, we accept empty-password login, LAN-scoped by ufw
#   on the developer's host — NEVER the guest itself.
#
# This is deliberately unsafe on a public network. Do NOT ship a
# route from anything but the loopback / test-host LAN to the guest's
# port 22. The QEMU --hostfwd flag binds to 127.0.0.1 on the host.
PermitEmptyPasswords yes
PasswordAuthentication yes
PermitRootLogin no

# vinOS wifi backend: NetworkManager owns wifi with iwd as its wpa_supplicant
# replacement. iwd stays required (T2 wifi recipe hard-depends on it — see
# feedback-baseline-never-regress-t2-wifi). NM handles DHCP + dbus state so
# Omarchy's shell reports connected instead of the false-negative in v2.0.1.
#
# systemd-networkd's 20-wlan.network is neutralized by ship-time masking to
# keep only one DHCP client on wifi interfaces (both fighting is race-y).
[device]
wifi.backend=iwd

[main]
dhcp=internal
plugins=keyfile

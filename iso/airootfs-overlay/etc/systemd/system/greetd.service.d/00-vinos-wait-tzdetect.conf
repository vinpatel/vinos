# Block the login screen until vinos-tzdetect has finished (or timed
# out at 30 s). Reason: first-boot on real T2 hardware, the desktop
# was appearing while tzdetect was still retrying, so the clock showed
# UTC — bad UX. Plymouth splash covers the wait; user only ever sees
# the login with the correct local time.
[Unit]
Wants=vinos-tzdetect.service
After=vinos-tzdetect.service

# vinOS live: releng ships an autologin-root drop-in for getty@tty1, which
# fights greetd for VT1 and prevents graphical.target from reaching in the
# live boot. This drop-in sorts after "autologin.conf" and re-defines
# ExecStart to a plain agetty (no --autologin root).
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -- \\u' --noclear - $TERM
Type=idle

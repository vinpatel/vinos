# vinOS: extend plymouth-quit-wait's timeout so it holds the framebuffer
# long enough for the compositor to grab DRM. DO NOT add After=greetd —
# greetd.service already declares After=plymouth-quit-wait via the standard
# graphical chain; adding the reverse edge here caused a circular ordering
# dependency in v2.0.2r1 that stalled greetd from ever starting (systemd
# skipped one edge of the cycle → Hyprland never launched).
[Service]
TimeoutStopSec=30

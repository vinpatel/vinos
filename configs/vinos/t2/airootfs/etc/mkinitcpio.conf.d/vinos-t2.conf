# vinOS T2 — live archiso initramfs modules.
# Ensures brcmfmac (Wi-Fi), apple-bce (Thunderbolt/USB backplane), and
# hid_apple (keyboard/trackpad) are available at very-early boot on the
# live ISO. Matches the verified project_t2_wifi_recipe recipe.
MODULES+=(apple-bce usbhid hid_apple hid_generic xhci_pci xhci_hcd brcmfmac)

# vinOS Hyprland config — clean-room rewrite, no Omarchy code.
# Plain Hyprland .conf syntax (upstream standard). No Lua wrapper.
#
# Structure:
#   hyprland.conf     — this file, entry point, user-editable
#   defaults/*.conf   — vinOS defaults (looknfeel, animations, autostart)
#   bindings/*.conf   — keybindings grouped by category
#   monitors.conf     — user's monitor setup (defaults reasonable)
#   colors.conf       — theme colors (auto-generated by vinos-theme-set)
#
# Users add personal customizations at the bottom of this file.
# Everything above the "USER OVERRIDES" line is vinOS-managed and may be
# rewritten by updates; below stays untouched.

# ─── vinOS-managed section ───

# System defaults (blur, gaps, opacity, animations)
source = /usr/share/vinos/default/hypr/looknfeel.conf
source = /usr/share/vinos/default/hypr/animations.conf
source = /usr/share/vinos/default/hypr/input.conf
source = /usr/share/vinos/default/hypr/env.conf

# Theme colors (rewritten by vinos-theme-set on theme change)
source = ~/.config/hypr/colors.conf

# Brand accent — pinned regardless of theme (Phase C)
source = /usr/share/vinos/default/hypr/brand-accent.conf

# Monitor setup (user-editable)
source = ~/.config/hypr/monitors.conf

# Keybindings — grouped by category
source = /usr/share/vinos/default/hypr/bindings/applications.conf
source = /usr/share/vinos/default/hypr/bindings/agent.conf
source = /usr/share/vinos/default/hypr/bindings/tiling.conf
source = /usr/share/vinos/default/hypr/bindings/utilities.conf
source = /usr/share/vinos/default/hypr/bindings/media.conf
source = /usr/share/vinos/default/hypr/bindings/clipboard.conf

# Window rules (workspace layouts, floating rules, blur exceptions)
source = /usr/share/vinos/default/hypr/windowrules.conf

# Autostart — vinos services + user apps
source = /usr/share/vinos/default/hypr/autostart.conf
source = ~/.config/hypr/autostart.conf

# ─── USER OVERRIDES (safe to edit; survives updates) ───

# Add personal keybindings, monitor overrides, window rules here.
# Example:
#   bind = SUPER SHIFT, R, exec, alacritty -e ssh myserver

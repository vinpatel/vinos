# vinOS SSH hardening — layered over stock sshd_config.
# This drop-in ships in the ISO but sshd.service is NOT enabled by default.
# If a user starts sshd, they get these defaults.

PasswordAuthentication no
PermitRootLogin no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PermitEmptyPasswords no
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
MaxAuthTries 3
LoginGraceTime 30

# vinOS keybindings — Agent / AI (vinOS-specific, no Omarchy equivalent)
# The agentic differentiator. Phase C will grow this.

$mainMod = SUPER

# AI chat — opens foot with vinos-ai in a titled window (Phase C moves this
# to workspace 6 with a preset layout: chat left, routine output right)
bind = $mainMod, A,          exec, foot --title "vinOS AI" -e vinos-ai chat

# Claude Code (higher-cost, deep reasoning)
bind = $mainMod SHIFT, A,    exec, foot --title "Claude Code" -e claude

# Routines — quick access
bind = $mainMod, R,          exec, foot --title "vinOS Routines" -e vinos-routine list
bind = $mainMod SHIFT, R,    exec, vinos-brief

# Cheatsheet — Hyprland keybindings viewer
bind = $mainMod, K,          exec, vinos-cheatsheet
bind = $mainMod ALT, K,      exec, foot --title "tmux keys" -e less /usr/share/vinos/docs/TMUX-KEYS.md

# Focus mode (Phase C: ties into routine notifications, dims waybar during
# long routines, auto-DND). Today: standalone DND toggle.
bind = $mainMod SHIFT, F,    exec, vinos-focus 25m

# vinOS keybindings — System utilities

$mainMod = SUPER

# Wi-Fi + Bluetooth
bind = $mainMod CTRL, W,     exec, foot --title "vinOS Wi-Fi" -e impala
bind = $mainMod CTRL, B,     exec, foot --title "vinOS Bluetooth" -e bluetuith

# Themes
bind = $mainMod CTRL, T,     exec, vinos-theme-pick
bind = $mainMod SHIFT CTRL, Space, exec, vinos-menu theme

# Backgrounds
bind = $mainMod CTRL, Space, exec, vinos-menu background
bind = $mainMod CTRL, N,     exec, vinos-background-next

# System actions
bind = $mainMod, Escape,     exec, vinos-menu system
bind = , XF86PowerOff,       exec, vinos-menu system

# Toggles
bind = $mainMod CTRL, I,     exec, vinos-toggle-idle
bind = $mainMod CTRL, U,     exec, vinos-toggle-touchpad
bind = $mainMod CTRL, D,     exec, vinos-toggle-nightlight
bind = $mainMod CTRL, O,     exec, vinos-toggle-notification-silencing

# Notifications — dismiss latest
bind = $mainMod SHIFT, N,    exec, makoctl dismiss
bind = $mainMod SHIFT CTRL, N, exec, makoctl dismiss --all

# Waybar toggle
bind = $mainMod SHIFT, B,    exec, vinos-toggle-topbar

# Restart shell components
bind = $mainMod CTRL, R,     exec, vinos-restart-hyprland

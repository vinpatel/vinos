# vinOS keybindings — Media + brightness (function keys)

# Volume (locked keys work when locked too)
bindl = , XF86AudioRaiseVolume, exec, vinos-swayosd-client --output-volume raise
bindl = , XF86AudioLowerVolume, exec, vinos-swayosd-client --output-volume lower
bindl = , XF86AudioMute,        exec, vinos-swayosd-client --output-volume mute-toggle
bindl = , XF86AudioMicMute,     exec, vinos-swayosd-client --input-volume mute-toggle

# Media transport
bindl = , XF86AudioPlay,        exec, playerctl play-pause
bindl = , XF86AudioPause,       exec, playerctl pause
bindl = , XF86AudioNext,        exec, playerctl next
bindl = , XF86AudioPrev,        exec, playerctl previous

# Brightness (display + keyboard)
bindl = , XF86MonBrightnessUp,   exec, vinos-swayosd-brightness raise
bindl = , XF86MonBrightnessDown, exec, vinos-swayosd-brightness lower
bindl = , XF86KbdBrightnessUp,   exec, vinos-swayosd-kbd-brightness raise
bindl = , XF86KbdBrightnessDown, exec, vinos-swayosd-kbd-brightness lower

# T2 Mac fn-key defaults
bindl = , XF86Launch1,           exec, vinos-menu system

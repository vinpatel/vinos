# vinOS keybindings — Application launchers
# All chord assignments are vinOS UX decisions; muscle memory
# preserved from 2.0.x for smooth migration.

$mainMod = SUPER

# Terminal + editor
bind = $mainMod, Return,     exec, foot
bind = $mainMod, N,          exec, foot -e nvim
bind = $mainMod, T,          exec, foot -e btop

# Launcher + menu
bind = $mainMod, Space,      exec, walker
bind = $mainMod, D,          exec, walker
bind = $mainMod ALT, Space,  exec, vinos-menu
bind = $mainMod SHIFT code:201, exec, vinos-menu   # Copilot key on some keyboards

# Everyday apps
bind = $mainMod, B,          exec, chromium
bind = $mainMod, E,          exec, nautilus
bind = $mainMod, F,          exec, nautilus
bind = $mainMod, M,          exec, spotify
bind = $mainMod, G,          exec, signal-desktop
bind = $mainMod, H,          exec, obsidian
bind = $mainMod, slash,      exec, 1password --toggle

# Screen lock
bind = $mainMod, L,          exec, hyprlock

# Screenshot
bind = $mainMod SHIFT, C,    exec, hyprpicker -a
bind = , Print,              exec, vinos-capture-screenshot
bind = $mainMod SHIFT, S,    exec, vinos-capture-screenshot

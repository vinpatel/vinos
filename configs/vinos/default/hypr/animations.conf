# vinOS animation language
# Faster than Omarchy (300ms → 200ms), single bezier everywhere.
# The "swift out" curve — sharp attack, gentle settle.

animations {
    enabled = true

    # Single named bezier used by every animation. Phase C consistency.
    bezier = vinos, 0.16, 1, 0.3, 1
    bezier = vinosFast, 0.22, 1, 0.36, 1

    # Durations in 10ms units (Hyprland convention).
    # 20 = 200ms (default target)
    # 12 = 120ms (fastest — for focus/hover)
    # 30 = 300ms (only for very large moves)

    animation = windows,       1, 20, vinos, popin 80%
    animation = windowsIn,     1, 20, vinos, popin 80%
    animation = windowsOut,    1, 15, vinos, popin 80%
    animation = windowsMove,   1, 18, vinos
    animation = border,        1, 15, vinos
    animation = borderangle,   1, 30, vinos, once
    animation = fade,          1, 15, vinos
    animation = fadeIn,        1, 15, vinos
    animation = fadeOut,       1, 15, vinos
    animation = fadeSwitch,    1, 15, vinos
    animation = fadeShadow,    1, 15, vinos
    animation = fadeDim,       1, 15, vinos
    animation = workspaces,    1, 22, vinos, slidevert
    animation = specialWorkspace, 1, 20, vinos, slidevert
    animation = layers,        1, 18, vinos, popin 90%
    animation = layersIn,      1, 18, vinos, popin 90%
    animation = layersOut,     1, 15, vinos, popin 90%
}

# vinOS brand accent — cyan #33ccff pinned everywhere regardless of theme.
# Sourced by Omarchy's Hyprland config chain via `source =` in the vinos
# overlay layer. Omarchy themes may shift accent per palette; this file
# pins vinOS's identity color on top so the brand stays consistent.
#
# See NOTICES.md: files inside omarchy/ are © DHH under MIT. This overlay
# is © 2026 Vin Patel under MIT.

# Window border — active border cyan, inactive dim slate
general {
    col.active_border = rgba(33ccffff) rgba(33ccffff) 45deg
    col.inactive_border = rgba(1a2733aa)
}

# Group border (tabbed windows) uses the same brand accent
group {
    col.border_active = rgba(33ccffff)
    col.border_inactive = rgba(1a2733aa)
    col.border_locked_active = rgba(33ccffff)
    col.border_locked_inactive = rgba(1a2733aa)
}

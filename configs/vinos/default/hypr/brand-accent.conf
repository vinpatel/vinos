# vinOS brand accent — pinned #33ccff regardless of theme.
# Sourced LAST in hyprland.conf so it wins over theme colors.
# This is what Omarchy doesn't do — every theme gets a different accent.
# vinOS: one brand, one accent, always cyan.

$vinosAccent = rgb(33ccff)
$vinosAccent2 = rgb(bb9af7)

general {
    col.active_border = $vinosAccent $vinosAccent2 45deg
}

decoration {
    # Subtle inner glow when focused
    col.shadow = rgba(33ccff40)
}

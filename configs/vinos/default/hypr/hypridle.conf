# vinOS hypridle — screen dim / lock / suspend policy
# Balanced for agent operators (long-running local model doesn't get killed
# by aggressive idle, but eyes-off laptop still locks)

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 4 min → dim screen
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min → dim keyboard backlight (T2 Mac)
listener {
    timeout = 300
    on-timeout = brightnessctl -sd 'apple::kbd_backlight' set 0
    on-resume = brightnessctl -rd 'apple::kbd_backlight'
}

# 10 min → lock the screen
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 min → turn off display
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 45 min (only on battery) → suspend
listener {
    timeout = 2700
    on-timeout = [[ "$(cat /sys/class/power_supply/AC*/online 2>/dev/null | head -1)" != "1" ]] && systemctl suspend
}

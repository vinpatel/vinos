# vinOS hyprlock — clean-room, agent-native lockscreen
# Cosmos wallpaper · glass card · glance widget · brand accent password field

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = true
}

# ─── Background: current wallpaper (mirrored from vinos-background) ───
background {
    monitor =
    path = ~/.config/vinos/wallpaper.png
    blur_passes = 4
    blur_size = 8
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# ─── Glance widget: uptime · unread · next routine · weather ───
label {
    monitor =
    text = cmd[update:60000] vinos-lockscreen-glance
    color = rgba(230, 230, 230, 0.95)
    font_size = 13
    font_family = Inter
    position = 40, -40
    halign = left
    valign = top
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.8)
}

# ─── Time (large, center-ish, above the input) ───
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = rgba(255, 255, 255, 0.95)
    font_size = 108
    font_family = Inter Light
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.6)
}

# ─── Date (below time) ───
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(230, 230, 230, 0.80)
    font_size = 20
    font_family = Inter
    position = 0, 60
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.6)
}

# ─── vinOS wordmark (bottom center, subtle) ───
label {
    monitor =
    text = vinOS
    color = rgba(51, 204, 255, 0.85)
    font_size = 20
    font_family = Inter Semi Bold
    position = 0, 30
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.6)
}

# ─── Password input field ───
input-field {
    monitor =
    size = 340, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.55
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(51, 204, 255, 0.5)
    inner_color = rgba(10, 14, 20, 0.85)
    font_color = rgba(230, 230, 230, 0.95)
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    hide_input = false
    rounding = 26
    check_color = rgba(51, 204, 255, 1.0)
    fail_color = rgba(255, 107, 107, 1.0)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fail_transition = 300
    capslock_color = rgba(255, 183, 77, 1.0)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -140
    halign = center
    valign = center
}

# ─── User @ host below input ───
label {
    monitor =
    text = cmd[update:0] echo "$USER@$(hostname)"
    color = rgba(180, 188, 200, 0.75)
    font_size = 12
    font_family = JetBrains Mono
    position = 0, -220
    halign = center
    valign = center
}

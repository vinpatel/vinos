# vinOS Hyprland autostart — what starts with the session

# Wallpaper — hyprpaper daemon reads from ~/.config/hypr/hyprpaper.conf
exec-once = hyprpaper

# Top bar
exec-once = waybar

# Notifications
exec-once = mako

# Clipboard history
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Screen inactivity → lock
exec-once = hypridle

# XDG portal + PolicyKit
exec-once = /usr/lib/xdg-desktop-portal-hyprland
exec-once = /usr/lib/polkit-kde-authentication-agent-1 &

# vinOS boot marker (uses journal, no tty1 pollution — Phase A fix)
exec-once = systemctl --user start vinos-boot-marker.service

# vinOS installer autolaunch (no-op unless vinos.action=install on cmdline)
exec-once = vinos-installer-autolaunch-gui

# 1Password (daemon mode, headless until Super+/)
exec-once = 1password --silent

# vinOS Hyprland look-and-feel defaults
# Clean-room values informed by what looked good; will refine in Phase C.

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(2a2a2aff)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.98

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        vibrancy = 0.15
        popups = true
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000060)
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
}

master {
    new_status = master
    mfact = 0.6
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    animate_manual_resizes = true
    focus_on_activate = true
    vfr = true
    vrr = 1
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
    background_color = 0x0a0e14
}

cursor {
    inactive_timeout = 5
    no_hardware_cursors = true   # T2 workaround; safe on other hardware
}

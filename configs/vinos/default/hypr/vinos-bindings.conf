# vinOS custom keybindings — layered on top of Omarchy's binding chain.
# These add vinOS-specific chords for agent workflows without replacing
# Omarchy's defaults (which stay in omarchy/default/hypr/bindings/).
# See NOTICES.md — © 2026 Vin Patel, MIT.

# Terminal (foot) — Super+Return
bind = SUPER, Return, exec, uwsm-app -- foot

# Walker launcher (with Elephant provider) — Super+Space
bind = SUPER, Space, exec, uwsm-app -- vinos-launch-walker

# Master keybinding cheatsheet — Super+K
bind = SUPER, K, exec, uwsm-app -- vinos-cheatsheet

# AI-first chords — the vinOS differentiators
bind = SUPER, A, exec, uwsm-app -- foot --title 'vinOS AI' -e vinos-ai chat
bind = SUPER SHIFT, A, exec, uwsm-app -- foot --title 'Claude Code' -e claude

# Routines
bind = SUPER, R, exec, uwsm-app -- foot --title 'Routines' -e vinos-routine list
bind = SUPER SHIFT, R, exec, uwsm-app -- foot --title 'vinOS Brief' -e vinos-brief

# vinos-menu chord (Super+Alt+Space)
bind = SUPER ALT, Space, exec, uwsm-app -- vinos-menu
bind = SUPER, Escape, exec, uwsm-app -- vinos-menu system

# Common apps
bind = SUPER, Q, killactive
bind = SUPER, L, exec, uwsm-app -- hyprlock
bind = SUPER, B, exec, uwsm-app -- chromium
bind = SUPER, E, exec, uwsm-app -- nautilus
bind = SUPER, N, exec, uwsm-app -- foot -e nvim
bind = SUPER, T, exec, uwsm-app -- foot -e btop

# System TUIs
bind = SUPER CTRL, W, exec, uwsm-app -- foot --title 'Wi-Fi' -e impala
bind = SUPER CTRL, B, exec, uwsm-app -- foot --title 'Bluetooth' -e bluetuith
bind = SUPER CTRL, T, exec, uwsm-app -- vinos-theme-pick

# Clipboard history via cliphist
bind = SUPER, semicolon, exec, uwsm-app -- cliphist list | walker --dmenu | cliphist decode | wl-copy

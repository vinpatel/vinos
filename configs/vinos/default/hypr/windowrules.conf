# vinOS window rules — floating apps, workspace assignments, blur exceptions

# Floating rules
windowrule = float, class:(1Password)
windowrule = float, class:(org.gnome.Calculator)
windowrule = float, class:(nm-connection-editor)
windowrule = float, class:(pavucontrol)
windowrule = float, class:(gnome-disks)
windowrule = float, class:(blueman-manager)
windowrule = float, title:(Wi-Fi Networks)
windowrule = float, title:(Bluetooth)
windowrule = float, class:(vinos-installer)
windowrule = float, class:(vinos-menu)
windowrule = float, class:(vinos-cheatsheet)

# Installer window — fullscreen, front, always on top
windowrule = fullscreen, class:(vinos-installer)
windowrule = pin,        class:(vinos-installer)

# Menus — center + resize
windowrule = center, class:(vinos-menu)
windowrule = size 720 480, class:(vinos-menu)

# Cheatsheet — floating overlay
windowrule = center, class:(vinos-cheatsheet)
windowrule = size 900 600, class:(vinos-cheatsheet)
windowrule = float, class:(vinos-cheatsheet)

# Disable blur for terminals (readability)
windowrule = noblur, class:(foot)
windowrule = noblur, class:(Alacritty)
windowrule = noblur, class:(kitty)

# Firefox picture-in-picture
windowrule = float, title:(Picture-in-Picture)
windowrule = pin,   title:(Picture-in-Picture)
windowrule = size 640 360, title:(Picture-in-Picture)
windowrule = move 100%-660 100%-380, title:(Picture-in-Picture)

# Workspace assignments (Phase C: agent workspace)
# Workspace 6 reserved for agent workflows
workspace = 6, defaultName:agents, on-created-empty:foot --title "vinOS AI" -e vinos-ai chat

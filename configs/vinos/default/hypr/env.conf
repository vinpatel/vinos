# vinOS environment variables — cursor, toolkit theming, wayland flags

# Cursor
env = XCURSOR_THEME,vinos
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,vinos
env = HYPRCURSOR_SIZE,24

# Toolkit theming
env = GTK_THEME,vinos-dark
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland

# Firefox / Chromium Wayland
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_DBUS_REMOTE,1

# Java Swing wayland
env = _JAVA_AWT_WM_NONREPARENTING,1

# XDG portal
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Electron under Wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# vinOS identity — apps can gate features on this
env = VINOS,1
env = VINOS_VERSION,2.1.0

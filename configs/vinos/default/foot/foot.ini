# vinOS foot terminal — brand-native
# JetBrains Mono Nerd Font · cyan accent · subtle alpha for glass effect.

font=JetBrains Mono Nerd Font:size=11
line-height=17
letter-spacing=0
pad=12x12 center
initial-window-size-chars=110x32
initial-window-mode=windowed
title=vinOS Terminal
locked-title=no
box-drawings-uses-font-glyphs=yes

# foot 1.20+ moved alpha= from [colors-*] to [main]
alpha=0.94

# Modifiers for text bindings (CSI-u)
[csd]
preferred=none

[cursor]
style=beam
beam-thickness=2
blink=yes
blink-rate=680
color=1a1b26 33ccff

[mouse]
hide-when-typing=yes

[scrollback]
lines=8000
multiplier=3.0

# foot 1.20+ renamed [colors] → [colors-dark]
[colors-dark]
foreground=e6e6e6
background=0a0e14
selection-foreground=ffffff
selection-background=1a2733

# 16-color palette — vinOS tuned (cool blues, warm alerts)
regular0=0a0e14
regular1=ff6b6b
regular2=67d9a4
regular3=ffb74d
regular4=33ccff
regular5=bb9af7
regular6=88c0d0
regular7=d5d5d5

bright0=1a2733
bright1=ff8080
bright2=8ce0b8
bright3=ffc76d
bright4=5cd6ff
bright5=cbaeff
bright6=a3d0dc
bright7=ffffff

# Cursor color
cursor=1a2733 33ccff

# URL underline color
urls=33ccff

[key-bindings]
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
scrollback-home=Shift+Home
scrollback-end=Shift+End
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
primary-paste=none
search-start=Control+Shift+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
show-urls-launch=Control+Shift+u

[text-bindings]
# Send Shift+Return as CSI-u (TUIs can distinguish Shift+Enter)
\x1b[13;2u=Shift+Return
# Alt+Shift+Return as CSI-u for tmux M-S-Enter
\x1b[13;4u=Mod1+Shift+Return

### vinOS Limine bootloader config
### Overrides omarchy/default/limine/limine.conf during install.
### Ref: https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md

# 2 second timeout keeps boot fast; press any key to hold the menu.
timeout: 2

# Auto-select first entry. On T2 Macs the installer swaps this to the
# linux-t2 entry index (usually 3) at install time via a drop-in.
default_entry: 1

# Branding
interface_branding: vinOS Bootloader
interface_branding_color: 33ccff
interface_help_color: 33ccff
interface_help_color_bright: 5cd6ff

hash_mismatch_panic: no

# vinOS palette — cyan accent on dark-cosmos background
term_background: 0a0e14
backdrop: 0a0e14

# Terminal colors — vinOS palette (cool blues, warm alerts)
term_palette: 0a0e14;ff6b6b;67d9a4;ffb74d;33ccff;bb9af7;88c0d0;d5d5d5
term_palette_bright: 1a2733;ff8080;8ce0b8;ffc76d;5cd6ff;cbaeff;a3d0dc;ffffff

# Text colors
term_foreground: e6e6e6
term_foreground_bright: ffffff
term_background_bright: 1a2733

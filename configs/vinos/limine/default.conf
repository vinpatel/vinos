# vinOS Limine defaults — overrides omarchy/default/limine/default.conf
# during install. limine-mkinitcpio-hook reads this to know how to build
# entries when a kernel is installed/updated.

TARGET_OS_NAME="vinOS"

ESP_PATH="/boot"

# Kernel cmdline — inherited from Omarchy's silent-boot settings + our
# hardening additions (only applied when linux-hardened is the boot kernel;
# the multi-kernel setup layers per-kernel drop-ins via
# /etc/limine-entry-tool.d/*.conf).
KERNEL_CMDLINE[default]+="@@CMDLINE@@"
KERNEL_CMDLINE[default]+=" quiet splash loglevel=0 systemd.show_status=false rd.udev.log_level=0 vt.global_cursor_default=0"

# UKI (Unified Kernel Image) for tamper resistance + faster boot
ENABLE_UKI=yes
CUSTOM_UKI_NAME="vinos"

ENABLE_LIMINE_FALLBACK=yes

# Auto-detect other bootloaders (Windows on dual-boot, other Linux installs)
FIND_BOOTLOADERS=yes

# Boot order: our kernels first (Cachy/Hardened/T2), then fallback UKIs,
# then Omarchy's snapper snapshots (preserved — user gets free rollback).
BOOT_ORDER="*, *fallback, Snapshots"

# Snapshot browser tuning — 5 recent snapshots visible in boot menu
MAX_SNAPSHOT_ENTRIES=5
SNAPSHOT_FORMAT_CHOICE=5

# vinOS Mac muscle-memory — Hyprland fragment.
# Sourced from Omarchy's hyprland.conf at build time via:
#   source = ~/.config/hypr/vinos-mac.conf

# Natural scroll (Mac-style)
input {
    natural_scroll = true
    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

# Cmd+Shift+4 → area screenshot (Mac muscle memory)
# Note: kanata maps ⌘ → Ctrl at evdev layer, so Cmd+Shift+4 arrives as Ctrl+Shift+4
bind = CTRL SHIFT, 4, exec, grim -g "$(slurp)" - | wl-copy

# Cmd+Space → app launcher (walker)
bind = CTRL, Space, exec, walker

# Cmd+Q → close focused window
bind = CTRL, Q, killactive,

# Cmd+H → hide focused window (send to scratch)
bind = CTRL, H, movetoworkspacesilent, special:scratch

# Cmd+M → minimize (also to scratch)
bind = CTRL, M, movetoworkspacesilent, special:scratch

# Cmd+Tab → cycle windows
bind = CTRL, Tab, cyclenext

# Hot corners
# Bottom-left → launcher, bottom-right → show desktop
# Requires hyprland-plugins/hyprscroller or similar; comment kept for reference.
# workspace = 1, on-created-empty:hyprctl dispatch ...

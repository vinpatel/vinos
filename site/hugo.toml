baseURL = "https://vinos.dev/"
locale = "en-us"
title = "vinOS — the OS for agent operators"
enableRobotsTXT = true
enableGitInfo = false
# No external theme — we ship layouts/ + static/ ourselves.

[params]
  description   = "vinOS — the OS for agent operators. Boot to a working Claude Code + local LLM setup in 90 seconds."
  tagline       = "the OS for agent operators"
  promise       = "Boot to a working Claude Code + local LLM setup in 90 seconds."
  installCmd    = "curl -fsSL https://raw.githubusercontent.com/vinpatel/vinos/main/boot.sh | bash"
  github        = "https://github.com/vinpatel/vinos"
  isoURL        = "https://github.com/vinpatel/vinos/releases/latest"
  version       = "1.0.0"
  accent        = "#33ccff"
  accent2       = "#bb9af7"

[markup]
  [markup.highlight]
    style        = "github-dark"
    lineNos      = false
    noClasses    = false
    codeFences   = true

[[menu.main]]
  identifier = "install"
  name       = "Install"
  url        = "/install/"
  weight     = 10
[[menu.main]]
  identifier = "docs"
  name       = "Docs"
  url        = "/docs/"
  weight     = 20
[[menu.main]]
  identifier = "bundles"
  name       = "Bundles"
  url        = "/bundles/"
  weight     = 30

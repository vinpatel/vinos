baseURL = "https://vinos.computer/"
locale = "en-us"
title = "vinOS — the operating system your agents run on"
enableRobotsTXT = true
enableGitInfo = false
# No external theme — we ship layouts/ + static/ ourselves.

[params]
  description   = "vinOS is an agent runtime for x86_64 hardware you own. One codebase, two personas: a workstation you drive, and a headless node your agents run on. Local models by default, frontier models when they earn it."
  tagline       = "the operating system your agents run on"
  promise       = "One runtime, two personas. Flash a USB for the workstation; build an image for the fleet. The vinOS layer underneath is the same bash, the same units, the same CLI."
  installCmd    = "curl -fsSL https://raw.githubusercontent.com/vinpatel/vinos/main/boot.sh | bash"
  github        = "https://github.com/vinpatel/vinos"
  isoURL        = "https://github.com/vinpatel/vinos/releases/latest"
  sponsorGH     = "https://github.com/sponsors/vinpatel"
  sponsorOC     = "https://opencollective.com/vinos"
  version       = "1.4.0"
  # Brand mark colour — must equal the fill in assets/logo/vinos.svg,
  # which is what the ISO, Plymouth and the favicons all use.
  brand         = "#4FD1C5"
  accent        = "#bb9af7"

[markup]
  [markup.highlight]
    style        = "github-dark"
    lineNos      = false
    noClasses    = false
    codeFences   = true

[[menu.main]]
  identifier = "install"
  name       = "Install"
  url        = "/install/"
  weight     = 10
[[menu.main]]
  identifier = "docs"
  name       = "Docs"
  url        = "/docs/"
  weight     = 20
[[menu.main]]
  identifier = "bundles"
  name       = "Bundles"
  url        = "/bundles/"
  weight     = 30
[[menu.main]]
  identifier = "github"
  name       = "GitHub"
  url        = "https://github.com/vinpatel/vinos"
  weight     = 40

baseURL = "https://vinos.computer/"
locale = "en-us"
title = "vinOS — an agentic OS for founders, innovators, and thinkers"
enableRobotsTXT = true
enableGitInfo = false
# No external theme — we ship layouts/ + static/ ourselves.

[params]
  description   = "vinOS — an agentic OS for founders, innovators, and thinkers. Local LLMs and Claude Code, one keystroke away. Runs on any x86_64 laptop, workstation, or server — including OEM-preloaded machines."
  tagline       = "an agentic OS for founders, innovators, and thinkers"
  promise       = "Flash a USB. Boot. In fifteen minutes you're running local LLMs and Claude Code — one keystroke away. On any x86_64 machine."
  installCmd    = "curl -fsSL https://raw.githubusercontent.com/vinpatel/vinos/main/boot.sh | bash"
  github        = "https://github.com/vinpatel/vinos"
  isoURL        = "https://archive.org/details/vinos-1.1.0-x86_64"
  version       = "1.1.0"
  accent        = "#33ccff"
  accent2       = "#bb9af7"

[markup]
  [markup.highlight]
    style        = "github-dark"
    lineNos      = false
    noClasses    = false
    codeFences   = true


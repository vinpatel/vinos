baseURL = "https://vinos.computer/"
locale = "en-us"
title = "vinOS — the agentic startup OS"
enableRobotsTXT = true
enableGitInfo = false
# No external theme — we ship layouts/ + static/ ourselves.

[params]
  description   = "vinOS — the agentic startup OS. Autonomous agents fire on systemd timers. 80% on a local model, 20% on Claude when it matters. Runs on any x86_64 laptop, including T2 MacBooks."
  tagline       = "the agentic startup OS"
  promise       = "Flash a USB. Boot. In fifteen minutes you're running local LLMs and Claude Code — one keystroke away. On any x86_64 machine."
  installCmd    = "curl -fsSL https://raw.githubusercontent.com/vinpatel/vinos/main/boot.sh | bash"
  github        = "https://github.com/vinpatel/vinos"
  isoURL        = "https://github.com/vinpatel/vinos/releases/latest"
  sponsorGH     = "https://github.com/sponsors/vinpatel"
  sponsorOC     = "https://opencollective.com/vinos"
  version       = "2.1.0"
  accent        = "#33ccff"
  accent2       = "#bb9af7"
  # 80/20 router — headline economics used on /models/ and /routines/
  costMonthlyPremium = "$450"
  costMonthlyRouted  = "$90"
  costMonthlySaved   = "$360"
  # Enterprise comparison anchors — used on /for/enterprise/
  costMonthlyCopilotEnterprise = "$40"
  costMonthlyCursorEnterprise  = "$40"
  costMonthlyChatgptTeam       = "$30"

[markup]
  # /for/*.md pages use inline HTML for the audience-page layout —
  # goldmark strips raw HTML by default (unsafe=false). Turn it back
  # on so those templates render.
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style        = "github-dark"
    lineNos      = false
    noClasses    = false
    codeFences   = true

[[menu.main]]
  identifier = "see"
  name       = "See it work"
  url        = "/#watch-a-routine-run"
  weight     = 10
[[menu.main]]
  identifier = "docs"
  name       = "Docs"
  url        = "/docs/"
  weight     = 20
[[menu.main]]
  identifier = "models"
  name       = "Models"
  url        = "/models/"
  weight     = 30
[[menu.main]]
  identifier = "hosted"
  name       = "Hosted"
  url        = "/hosted/"
  weight     = 35
[[menu.main]]
  identifier = "download"
  name       = "Download"
  url        = "https://github.com/vinpatel/vinos/releases/latest"
  weight     = 40
[[menu.main]]
  identifier = "github"
  name       = "GitHub"
  url        = "https://github.com/vinpatel/vinos"
  weight     = 50

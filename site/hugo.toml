baseURL = "https://vinos.computer/"
locale = "en-us"
title = "vinOS — build your agents on hardware you own"
enableRobotsTXT = true
enableGitInfo = false
# No external theme — we ship layouts/ + static/ ourselves.

[params]
  description   = "vinOS — the OS for agent operators. Turn the laptop Apple forgot into a private AI machine. Local models do the 80%, Claude fills the gap. Fifteen minutes from USB to a working agent."
  tagline       = "the OS for agent operators"
  promise       = "Flash a USB. Boot. In fifteen minutes your MacBook, ThinkPad, or dusty desktop is running local LLMs and Claude Code — one keystroke away."
  installCmd    = "curl -fsSL https://raw.githubusercontent.com/vinpatel/vinos/main/boot.sh | bash"
  github        = "https://github.com/vinpatel/vinos"
  isoURL        = "https://archive.org/details/vinos-1.1.0-x86_64"
  version       = "1.1.0"
  accent        = "#33ccff"
  accent2       = "#bb9af7"

[markup]
  [markup.highlight]
    style        = "github-dark"
    lineNos      = false
    noClasses    = false
    codeFences   = true

[[menu.main]]
  identifier = "install"
  name       = "Install"
  url        = "/install/"
  weight     = 10
[[menu.main]]
  identifier = "docs"
  name       = "Docs"
  url        = "/docs/"
  weight     = 20
[[menu.main]]
  identifier = "bundles"
  name       = "Bundles"
  url        = "/bundles/"
  weight     = 30
[[menu.main]]
  identifier = "github"
  name       = "GitHub"
  url        = "https://github.com/vinpatel/vinos"
  weight     = 40

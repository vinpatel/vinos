<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ .Description | default .Site.Params.description }}">

  <!-- Open Graph -->
  <meta property="og:title"       content="{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ .Site.Title }}">
  <meta property="og:description" content="{{ .Description | default .Site.Params.description }}">
  <meta property="og:type"        content="website">
  <meta property="og:url"         content="{{ .Permalink }}">
  <meta property="og:image"       content="{{ .Site.BaseURL }}img/og.png">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt"    content="vinOS — the operating system your agents run on">
  <meta property="og:site_name"    content="vinOS">

  <!-- Twitter/X reads its own tags and falls back to a small square card
       without them, which crops the wordmark out of the image. -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ .Site.Title }}">
  <meta name="twitter:description" content="{{ .Description | default .Site.Params.description }}">
  <meta name="twitter:image"       content="{{ .Site.BaseURL }}img/og.png">

  <meta name="theme-color"        content="#f7f2e8">

  <link rel="icon" href="{{ "img/favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/vinos.css" | relURL }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main" tabindex="-1">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>

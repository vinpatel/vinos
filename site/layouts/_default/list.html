{{ define "main" }}
<div class="page">
  <article class="doc prose measure-wide" style="padding-top: var(--sp-7);">
    <header class="section-head" style="margin-bottom: var(--sp-6);">
      {{ with .Section }}<div class="section-eyebrow">{{ . }}</div>{{ end }}
      <h1 style="font-size: var(--fs-3xl); letter-spacing: -0.025em; max-width: 22ch;">{{ .Title }}</h1>
      {{ with .Description }}<p class="section-lede">{{ . }}</p>{{ end }}
    </header>

    {{ .Content }}

    {{ with .Pages }}
    <div class="spec-index">
      {{ range .ByTitle }}
      <a class="spec-link" href="{{ .Permalink }}">
        <span class="spec-link-eyebrow">{{ $.Section }}</span>
        <h3>{{ .Title }}</h3>
        {{ with .Description }}<p>{{ . }}</p>{{ end }}
        <span class="spec-link-more">Read →</span>
      </a>
      {{ end }}
    </div>
    {{ end }}
  </article>
</div>
{{ end }}

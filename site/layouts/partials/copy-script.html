{{/* Tiny copy button handler · ≤20 lines JS · vanilla · non-blocking */}}
<script>
document.addEventListener('click', function (e) {
  var btn = e.target.closest('[data-copy]');
  if (!btn) return;
  var block = btn.closest('.code-block');
  var code = block && block.querySelector('code');
  if (!code) return;
  var text = code.innerText;
  navigator.clipboard && navigator.clipboard.writeText(text).then(function () {
    var prev = btn.textContent.trim();
    btn.classList.add('copied');
    btn.textContent = 'copied';
    setTimeout(function () {
      btn.classList.remove('copied');
      btn.innerHTML = btn.dataset.origHtml || '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> copy';
    }, 1400);
  });
}, false);
</script>

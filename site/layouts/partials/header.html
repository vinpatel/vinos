<header class="site-header">
  <a href="/" class="brand" aria-label="vinOS home">
    <svg class="brand-mark" viewBox="0 0 100 100" width="28" height="28" aria-hidden="true">
      <polygon points="20,10 45,90 55,90 30,10" fill="#33ccff"/>
      <polygon points="70,10 55,60 45,60 60,10" fill="#c0caf5"/>
      <rect class="brand-caret" x="52" y="72" width="14" height="10" fill="#33ccff"/>
    </svg>
    <span class="brand-name">vinOS</span>
  </a>
  <nav class="site-nav">
    {{ range .Site.Menus.main }}
      <a href="{{ .URL }}"{{ if hasPrefix .URL "http" }} target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
